[package]
name = "birdo-vpn-desktop"
version = "1.4.43"
description = "Birdo VPN Desktop Client (Windows, macOS & Linux)"
authors = ["Birdo VPN"]
license = "Proprietary"
publish = false # Tauri app — never published to crates.io (also lets cargo-deny skip it)
edition = "2021"
rust-version = "1.77"

[lib]
name = "birdo_vpn_desktop_lib"
# Only rlib needed for Tauri - cdylib/staticlib cause C++ runtime linker errors
crate-type = ["rlib"]

[build-dependencies]
# The Windows app manifest (requireAdministrator) is embedded via tauri-build's
# WindowsAttributes::app_manifest — NOT winres — to avoid a double-manifest
# link collision that drops the elevation level. See build.rs.
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.11.5", features = ["tray-icon"] }
# Decode the embedded tray PNGs into raw RGBA ourselves (Image::new_owned).
# NOT tauri's "image-png" feature — that pulls the moxcms/pxfm colour chain
# (edition2024 Cargo feature / Rust 1.85+). That WOULD build now under our 1.96
# pin, but png 0.17 stays a leaner, known-good decode path we keep to avoid
# dragging that graph in. png 0.17 builds cleanly on 1.96.
png = "0.17"
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-dialog = "2.0"  # Native file picker for split-tunnel .exe selection
# Single-instance guard: a VPN client must never run twice (a 2nd process would
# fight the first over the WFP filters / tunnel adapter). The single-instance
# callback also forwards a birdo:// deep-link argv to the already-running
# instance on Windows, where a fresh process would otherwise be spawned.
tauri-plugin-single-instance = { version = "2.0", features = ["deep-link"] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
erased-serde = "0.4"  # H-1: trait-object serialization for retry interceptor

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }

# TLS certificate pinning (CA-chain SPKI — see src/api/cert_pin.rs).
# Pinned to the same rustls (0.23, ring provider) reqwest's rustls-tls uses so the
# custom ClientConfig type matches `use_preconfigured_tls`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
x509-parser = "0.18"

# Socket configuration (for buffer sizes)
socket2 = "0.5"

# Secure storage — see the per-target `keyring` entries below.
#
# DO NOT add `keyring` here as a plain dependency. keyring 3.x ships NO default
# features and picks its backend at COMPILE time: without an explicit
# `*-native`/secret-service feature it silently resolves to the `mock` backend
# (keyring src/lib.rs: `pub use mock as default`), which is an in-memory store
# that accepts every write and returns NoEntry for every read. Nothing fails
# loudly — tokens simply never persist. That shipped as `keyring = "3.2"` and
# left every platform unable to remember a login. Backends are declared per
# target so each OS links its real keystore and nothing else.

# Crypto. WireGuard's ChaCha20-Poly1305 / BLAKE2s live INSIDE boringtun; the
# app never calls them directly, so they are not declared here (F19, 2026-09-13:
# the direct `chacha20poly1305`/`blake2` entries were dead and only existed to
# receive Dependabot majors boringtun could not follow).
sha2 = "0.10"  # DLL integrity verification (already a transitive dep via tauri)
hmac = "0.12"  # FIX-1-7: Settings file HMAC integrity
hex = "0.4"    # FIX-1-7: Hex encoding for HMAC key storage
rand = "0.8"
# Ed25519 client attestation (src/api/attestation.rs). Already in the graph —
# rustls uses its ring provider and boringtun 0.7.1 links ring 0.17 — so this
# is a re-export of an existing dependency, not new compiled code.
ring = "0.17"
base64 = "0.22"
zeroize = { version = "1.7", features = ["derive"] }  # Secure memory wiping
# AUDIT-C1: BirdoPQ v1 — ML-KEM-1024 KEM (FIPS 203). The KAT fixture in
# src/vpn/fixtures/, not crate identity, is what keeps the four clients
# interoperable while Mobile-Client is still on pqcrypto-mlkem. Checked against
# BirdoVPN/Mobile-Client origin/main on 2026-09-16: native/rosenpass-jni,
# native/birdo-pq-ios and native/birdo-pq-server all still declare
# `pqcrypto-mlkem = { version = "0.1", ... }`, so "same crate everywhere" is
# NOT true today and must not be written here as if it were. What every client
# does share is the byte-for-byte encoding the backend's @noble/post-quantum
# encapsulates with, and the KAT is what proves it. The gate at
# scripts/ci/check-pq-features.sh fails if this comment claims parity again.
#
# 2026-09: migrated off `pqcrypto-mlkem` (PQClean's portable CLEAN C). PQClean
# upstream is archived read-only, and pqcrypto-mlkem / -traits / -internals all
# carry unmaintained advisories (RUSTSEC-2026-0161/-0162/-0163) whose own
# remediation text says to move to `ml-kem`.
#
# Measured effect on THIS crate's graph (Cargo.lock diff + `cargo tree`): 3
# entries leave (the pqcrypto trio, and with them the last C the PQ path
# compiled), 16 new crates arrive, and typenum is bumped 1.19.0 -> 1.20.1 in
# place, for a net 761 -> 774 [[package]] entries. Of the 16, five (pkcs8,
# spki, der, const-oid, base64ct) are optional ml-kem deps that our feature set
# never builds - `cargo tree -i` prints "nothing to print" for each. `cc` does
# NOT leave the build: aws-lc-sys and ring still use it. Neither does
# extended-ISA code leave; see the "Implementation" section of
# src/vpn/birdo_pq.rs for what did and did not change there.
#
# EXACT PIN, deliberately: this is the KEM, not a dependency. Every version
# move here is a crypto change that needs the KAT re-run and a changelog read,
# not a Dependabot rubber stamp.
#
# CORRECTED (review of #163): an earlier draft of this comment justified the
# pin with "ml-kem shipped FIPS 203 input validation and a Zeroize fix inside
# 0.3.x patch releases". Upstream does not say that, and a wrong citation in a
# crypto manifest is worse than none. The 0.3 line has exactly TWO published
# releases — 0.3.0 (2026-04-28) and 0.3.2 (2026-05-10); crates.io lists no
# other non-prerelease 0.3.x, and ml-kem/CHANGELOG.md records 0.3.1 as
# "Skipped as it was tagged without a version bump". That changelog gives
# 0.3.2 exactly one line: "Added - Optional on-by-default heap offload support
# ([#310])". The input-validation work the sentence was reaching for
# ("Validate encryption/encapsulation keys ([#179])", "Validate expanded
# decapsulation key hash ([#207])") landed in 0.3.0, the MINOR release, and
# the Zeroize entry is older still.
#
# The pin stays, on the real reason: 0.3.2 is a single patch release that
# already changed where key material is allocated, nobody here reviews this
# crate's patches, and the only thing standing between a bad one and a silent
# interop break is the KAT in src/vpn/fixtures/ — which only runs if someone
# is looking. `scripts/ci/check-pq-features.sh` gates the pin and the feature
# set on every PR.
#
# default-features = false + ["alloc", "zeroize"]: the crate's default is
# ["alloc"] ALONE — `zeroize` is opt-in, and without it DecapsulationKey is
# not ZeroizeOnDrop (ml-kem-0.3.2/src/decapsulation_key.rs:142,156 gate both
# `impl Drop` and `impl ZeroizeOnDrop` on `#[cfg(feature = "zeroize")]`).
# Because a missing `zeroize` disarms every dk wipe without failing a single
# test, that feature set is asserted in CI by
# `scripts/ci/check-pq-features.sh`, not just written down here.
#
# There is deliberately NO `hazmat` entry, here or in [dev-dependencies].
# `hazmat` gates NOTHING but rustdoc: in ml-kem 0.3.2 the feature is defined
# as `hazmat = []` and its only use is
# `#[cfg_attr(not(feature = "hazmat"), doc(hidden))]` on
# `EncapsulationKey::encapsulate_deterministic`
# (ml-kem-0.3.2/src/encapsulation_key.rs:43-45) — a plain `pub fn` that is
# compiled into every profile regardless. Requesting it in [dev-dependencies]
# bought nothing and, worse, read as a build-time guarantee that deterministic
# encapsulation cannot reach a release binary. It is not one. Keeping
# `encapsulate_deterministic` out of production is a CODE-REVIEW invariant:
# the only caller is the `#[cfg(test)]` KAT helper in src/vpn/birdo_pq.rs,
# and it must stay that way.
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.12"

# Fast mutex for async-safe crypto operations (replaces std::sync::Mutex)
parking_lot = "0.12"

# WireGuard userspace implementation
# 0.7.1: drops the RUSTSEC-2024-0344 curve25519-dalek 4.0.0-rc.3 pin and
# ring 0.16 (moves to ring 0.17 + x25519-dalek 2.x). Crypto-core upgrade —
# requires a live-tunnel E2E pass before any release that ships it.
boringtun = "0.7.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# System directories for crash reports
dirs = "6.0"

# Logging. (`log` was a direct dependency with no `log::` call anywhere in
# src/ — the app logs through `tracing`. Dropped 2026-09; it stays in the graph
# transitively, so nothing about the built binary changes.)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4.2"
once_cell = "1.19"
regex = "1"
which = "8.0"  # Find xray.exe binary in PATH
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tauri-plugin-process = "2.2"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader"
] }

# Wintun driver bindings
wintun = "0.5"

# Registry read for enumerating installed apps (split-tunnel picker). Simple,
# pure-Rust wrapper over windows-sys; builds on the pinned 1.96 toolchain.
winreg = "0.52"

# Real Windows Credential Manager (wincred) instead of keyring's mock backend.
keyring = { version = "3.2", features = ["windows-native"] }

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
# nix crate for utun/socket/ioctl operations
nix = { version = "0.29", features = ["net", "ioctl", "socket", "fs"] }
# libc for raw utun fd read/write and AF_SYSTEM socket creation
libc = "0.2"
# NOTE: no core-foundation / system-configuration — DNS and routes on macOS go
# through `networksetup`/`scutil` (tunnel_macos.rs); the bindings were declared
# but never referenced (removed 2026-09-13, F19).

# Real macOS Keychain instead of keyring's mock backend.
keyring = { version = "3.2", features = ["apple-native"] }

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
# libc for TUN fd read/write and ioctl
libc = "0.2"

# Real Secret Service (GNOME Keyring / KWallet over D-Bus) instead of keyring's
# mock backend. `sync-secret-service` keeps keyring's blocking API — the async
# backend would need a nested runtime from inside Tauri's tokio context.
# `crypto-rust` avoids an OpenSSL system dependency and `vendored` builds libdbus
# from source, so the Linux CI runner needs no extra apt packages.
keyring = { version = "3.2", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# RESOLVED 2026-07-02: boringtun 0.7.1 upgrade removed the curve25519-dalek
# 4.0.0-rc.3 pin (RUSTSEC-2024-0344) and ring 0.16 — no [patch] needed anymore.

[dev-dependencies]
tempfile = "3.13"
# K5 connect contract: validates the SERIALIZED ConnectRequest /
# MultiHopConnectRequest bodies against the vendored
# contract/vpn-protocol.schema.json (src/api/contract_tests.rs). Exact pin so a
# `cargo update` cannot change which draft-2020-12 semantics the gate applies.
# default-features = false: the defaults exist only to fetch remote `$ref`s
# (reqwest + rustls + aws-lc-rs, a C/asm build) and the vendored schema has
# none -- a test-only dep must not add a native toolchain to every runner.
#
# DISCLOSURE (review of #158): this dev-dependency is test-only, but Cargo
# resolves ONE version of each crate for the whole graph, and two of its
# transitive pins are exact -- jsonschema-value 0.56.0 wants zmij = "1.0.23"
# and fraction 0.17.0 wants num-bigint = "0.4.8". Unification therefore moved
# two crates that ARE in the shipped release binary: serde_json now links
# zmij 1.0.23 (was 1.0.9) and x509-parser -> der-parser links num-bigint 0.4.8
# (was 0.4.6) -- the cert-pin X.509 parsing path. Both are semver-compatible
# patch releases, cargo-deny advisories/licenses/bans pass, and they cannot be
# pinned back without dropping this dep. Whoever signs the next release should
# know the production dependency set changed here, not just the test set.
jsonschema = { version = "=0.56.0", default-features = false }
