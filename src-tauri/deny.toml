# cargo-deny configuration for Birdo VPN client (schema v2; cargo-deny >=0.18)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# In v2 vulnerabilities are always denied; this lists advisories we've reviewed
# and consciously accept (with justification + a review-by date).
ignore = [
    # RUSTSEC-2026-0194 / -0195: quick-xml quadratic duplicate-attribute check /
    # unbounded namespace allocation. 2026-09-12: the plist chain (tauri-utils /
    # tauri-build, build-time files) is FIXED — plist 1.10 pulls quick-xml 0.41.
    # The one chain left is tauri-plugin-notification -> notify-rust ->
    # tauri-winrt-notification 0.7 -> quick-xml 0.37, which renders OUR Windows
    # toast XML from our own strings — never attacker-supplied XML. notify-rust
    # (4.18.0, latest) still pins tauri-winrt-notification ^0.7, so nothing on
    # our side can move it. Review-by: 2026-12-01 (re-check notify-rust's pin).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
# v2: `unmaintained` is a scope enum, not a severity. We gate on vulnerabilities
# (always denied) and yanked crates; unmaintained advisories are not enforced
# (we can't control transitive maintenance), matching the old `unmaintained=warn`.
unmaintained = "none"
yanked = "warn"

[licenses]
# v2 denies any license not in this allow-list by default (the old
# unlicensed/copyleft/allow-osi-fsf-free keys were removed from the schema).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Skip our own first-party crate (license = "Proprietary", publish = false) — it
# isn't a third-party dependency whose license we need to vet.
private = { ignore = true }

# `ring` ships a custom LICENSE that doesn't resolve to a single SPDX id
# (cargo-deny scores it 0.66 < the 0.8 threshold -> "unlicensed"). Clarify it to
# its actual license mix; MIT/ISC/OpenSSL are all allow-listed above. The hash
# matches ring 0.16.20's LICENSE file (from the cargo-deny output).
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Deny known-problematic crates here, e.g. { name = "openssl", version = "*" }.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
