# Birdo VPN — IPv6 leak block, minimal fallback (F-001).
#
# Used when the anchor-preserving ruleset fails to load — e.g. a host where
# /etc/pf.anchors/com.apple is missing or unreadable, which would fail the whole
# `load anchor` line. Same protection, minus Apple's anchors for the session.
#
# Single source of truth: include_str!()d by killswitch.rs and parse-checked by CI.

set block-policy drop
set skip on lo0

anchor "com.birdo.vpn"

pass quick inet6 from fe80::/10 to fe80::/10 no state
pass quick inet6 from any to ff02::/16 no state
# `return` not `drop` — see the note in ipv6-block.conf: a silent drop stalled
# our own dual-stack control-plane requests until timeout (frozen server switch).
block return quick inet6 all
