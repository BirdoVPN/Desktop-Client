# Birdo VPN — IPv6 leak block (F-001). Loaded as pf's MAIN RULESET.
#
# A named anchor is inert on stock macOS (/etc/pf.conf references none), so this
# must be the main ruleset — see killswitch.rs. It re-declares the stock com.apple
# anchors so Apple's own pf rules keep working for the session, then appends the
# block.
#
# IPv4 is deliberately never mentioned: pf's implicit default is *pass*, so a
# ruleset containing only inet6 rules CANNOT break IPv4 connectivity.
#
# This file is the single source of truth: killswitch.rs include_str!()s it, and
# CI parse-checks these exact bytes with `pfctl -n -f` on a real macOS runner.
# Keep the com.birdo.vpn marker anchor — reconcile_stale_pf_state() greps for it
# to tell OUR ruleset apart from a third party's before reverting anything.

set block-policy drop
set skip on lo0

scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

anchor "com.birdo.vpn"

# Link-local and link-scoped multicast only: covers NDP (NS/NA/RS/RA), DAD, MLD
# and DHCPv6 — everything the host needs to stay functional. Everything routable
# is dropped, in both directions.
pass quick inet6 from fe80::/10 to fe80::/10 no state
pass quick inet6 from any to ff02::/16 no state
# `return`, not `drop`: the packet is still never allowed out (identical leak
# protection — the rejection is generated locally and never egresses), but the
# sender learns IMMEDIATELY instead of waiting out a TCP timeout. With `drop`,
# any IPv6 connection made while the block is up — including OUR OWN
# control-plane HTTPS to the dual-stack api.birdo.app, and DoH — stalled
# silently, so a server switch could not fetch its new config and the app
# appeared frozen. Fast rejection lets the caller fall straight through to IPv4.
block return quick inet6 all
