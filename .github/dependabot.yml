# OPEN-WORK I11 (2026-09-13): this repo had no Dependabot at all, so its
# SHA-pinned action refs, npm tree and Cargo tree aged with no mechanism to
# ever surface an update — advisories arrived only via the audit gates
# (dependency-audit / cargo-deny), i.e. after the fact. Same shape as
# birdo-web/.github/dependabot.yml.
#
# Every bump still goes through the normal gates (tests.yml, cargo-deny,
# CodeQL, cert-pins) and the version-consistency check; a Dependabot PR is a
# proposal, not a merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # codeql-action/init and codeql-action/analyze MUST bump as ONE PR:
      # analyze refuses to consume a config written by a different version,
      # so split bumps leave neither able to go green.
      codeql:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # vitest and its coverage provider are version-locked to each other.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # parser and eslint-plugin are versioned together; a split bump leaves two
      # AST generations in the tree. #171 moved the parser alone to 8.70.0 and
      # left the plugin at 8.51.0 because the npm open-pull-requests-limit was
      # full — a group cannot be starved that way.
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # tauri, tauri-build and the tauri-plugin-* crates move together.
      tauri:
        patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
      # sha2 / hmac / hkdf are ONE RustCrypto `digest` generation: sha2 0.10 +
      # hmac 0.12 + hkdf 0.12 sit on digest 0.10; sha2 0.11 + hmac 0.13 +
      # hkdf 0.13 sit on digest 0.11. A lone bump cannot compile — #173 (hmac
      # 0.13 alone) failed every Rust job with
      #   error[E0277]: the trait bound `CoreWrapper<...Sha256VarCore...>:
      #     CoreProxy` is not satisfied   --> src/commands/settings.rs
      #   note: there are multiple different versions of crate `digest`
      # Grouped so the next proposal is the whole generation at once. That
      # move is deliberately NOT taken as a sweep item: it sits under both the
      # BirdoPQ PSK derivation (hkdf_to_psk) and the settings-file HMAC, the
      # existing HMAC tests are round-trip only with no fixed vector, and it
      # also needs KeyInit at settings.rs, four LowerHex formatting sites
      # (digest 0.11's Output is a hybrid_array::Array), and rust-version 1.85.
      # It gets its own PR with a fixed-vector test. No advisory affects the
      # 0.10/0.12 generation, so nothing forces it.
      rustcrypto-digest:
        patterns: ["sha2", "hmac", "hkdf"]
