name: Linux packages

# Builds the real .deb and AppImage on the PRs that can change them, exactly
# as release.yml's build-linux does, and runs its post-bundle gate.
#
# WHY THIS EXISTS: owner decision 2026-10-14 (L2) gave the AppImage its own
# THIRD-PARTY-NOTICES.txt, listing every system library it bundles from the
# build image (WebKitGTK, GTK, GLib, libsoup and what they link) with its
# Ubuntu package, source package at the exact version, copyright file and
# licence texts. scripts/ci/appimage-notices.sh does that after `tauri build`
# (dpkg -S on the runner), then re-bundles the AppImage with the result; the
# gate fails an AppImage that carries a library its notices do not list.
# That can only be proven on a real AppImage built on the real image, and no
# PR job built one: until this workflow only a release did. tests.yml's
# appimage-notices-selftest proves the logic with a fake dpkg on every PR;
# this proves it against ubuntu-22.04's real packages.
#
# UNSIGNED, and no secrets: no updater signing key (createUpdaterArtifacts is
# switched off for this build), no Sentry DSN (build.rs's release gate is
# waived with BIRDO_ALLOW_MISSING_SENTRY_DSN) and no attestation key. The
# packages are never uploaded; the AppImage's notices file is, so the library
# list it generated can be read.
#
# Not a required check: path-filtered. No caches: nothing release-shaped
# restores what a PR wrote (as nsis-installer.yml).

# The two path lists are the same; keep them so. (Not a YAML anchor: zizmor
# warns that anchors can make its results wrong.)
on:
  pull_request:
    paths:
      - "src-tauri/**" # the app, Cargo.lock, tauri.conf.json, resources
      - "package.json"
      - "package-lock.json" # pins @tauri-apps/cli, i.e. the bundler and linuxdeploy
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/linux-deps/**" # what the AppImage bundles is what this installs
      - ".github/workflows/linux-packages.yml"
      - ".github/workflows/release.yml" # the Xray pins are read from it
      - "scripts/ci/appimage-notices.sh"
      - "scripts/ci/verify-bundled-xray.sh"
      - "scripts/generate-appimage-notices.mjs"
      - "scripts/generate-third-party-notices.mjs"
      - "scripts/lib/**"
      - "third_party/licenses/**"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/linux-deps/**"
      - ".github/workflows/linux-packages.yml"
      - ".github/workflows/release.yml"
      - "scripts/ci/appimage-notices.sh"
      - "scripts/ci/verify-bundled-xray.sh"
      - "scripts/generate-appimage-notices.mjs"
      - "scripts/generate-third-party-notices.mjs"
      - "scripts/lib/**"
      - "third_party/licenses/**"
  # Weekly on main: the runner image's packages change without a commit here
  # (a security update moves a library to a new version, or a new one gets
  # bundled), and a release should not be the first to notice.
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux-packages:
    name: Linux packages (ubuntu-22.04) - build, AppImage library notices, gate
    # The schedule runs in this repository only, not in forks.
    if: github.event_name != 'schedule' || github.repository == 'BirdoVPN/Desktop-Client'
    # The image release.yml's build-linux runs on: the AppImage bundles ITS
    # libraries, so the mapping must run against the same packages.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ARCH: x86_64-unknown-linux-gnu # what build-linux's matrix passes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # No caches in this workflow (see the header).
          package-manager-cache: false

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies (the locked @tauri-apps/cli)
        run: npm ci

      # As build-linux: the tracked placeholder goes, xray is staged.
      - name: Fetch xray at release.yml's pins
        run: |
          set -euo pipefail
          rel=.github/workflows/release.yml
          pin() { sed -nE "s/^[[:space:]]*$1: ([0-9a-zA-Z.]+)$/\1/p" "$rel"; }
          version=$(pin XRAY_VERSION)
          zip="$RUNNER_TEMP/Xray-linux-64.zip"
          curl -fsSL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/$version/Xray-linux-64.zip" -o "$zip"
          echo "$(pin XRAY_LINUX_SHA256)  $zip" | sha256sum -c -
          unzip -q -o "$zip" -d "$RUNNER_TEMP/xray"
          mkdir -p src-tauri/resources
          rm -f src-tauri/resources/.gitkeep
          install -m 0755 "$RUNNER_TEMP/xray/xray" src-tauri/resources/xray
          sha=$(sha256sum src-tauri/resources/xray | cut -d' ' -f1)
          echo "XRAY_BINARY_SHA256=$sha" >> "$GITHUB_ENV"
          echo "Bundling Xray $version xray ($sha)"

      - name: Generate the third-party notices (resources/THIRD-PARTY-NOTICES.txt)
        run: |
          node scripts/generate-third-party-notices.mjs --release --target "$ARCH" \
            --xray src-tauri/resources/xray --xray-license "$RUNNER_TEMP/xray/LICENSE"

      - name: Build the .deb and the AppImage (unsigned)
        timeout-minutes: 25
        env:
          # A PR has no SENTRY_DSN, and these packages are never shipped.
          BIRDO_ALLOW_MISSING_SENTRY_DSN: "1"
        run: |
          set -euo pipefail
          # No TAURI_SIGNING_PRIVATE_KEY on a PR: with the updater artifacts
          # on, tauri fails after bundling for want of it. Nothing else changes.
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/pr-packages.json"
          # build-linux's command, with that config.
          npx tauri build --target "$ARCH" --config "$RUNNER_TEMP/pr-packages.json" -- --locked
          ls -la "src-tauri/target/$ARCH/release/bundle/deb" "src-tauri/target/$ARCH/release/bundle/appimage"

      # release.yml's step, with the same config as the build above.
      - name: AppImage - list its bundled system libraries in its own notices, then re-bundle it
        run: bash scripts/ci/appimage-notices.sh "$ARCH" "$RUNNER_TEMP/appimage-notices/THIRD-PARTY-NOTICES.txt" --config "$RUNNER_TEMP/pr-packages.json"

      # release.yml's gate, verbatim.
      - name: Gate - bundled xray (.deb, .AppImage) must hash to the compiled-in XRAY_BINARY_SHA256; THIRD-PARTY-NOTICES.txt must be this build's
        env:
          NOTICES_FILE: src-tauri/resources/THIRD-PARTY-NOTICES.txt
        run: |
          set -euo pipefail
          export APPIMAGE_NOTICES_FILE="$RUNNER_TEMP/appimage-notices/THIRD-PARTY-NOTICES.txt"
          bundle="src-tauri/target/$ARCH/release/bundle"
          shopt -s nullglob
          debs=("$bundle"/deb/*.deb)
          appimages=("$bundle"/appimage/*.AppImage)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb and one .AppImage under $bundle (found ${#debs[@]} and ${#appimages[@]})"
            exit 1
          fi
          bash scripts/ci/verify-bundled-xray.sh "${XRAY_BINARY_SHA256:-}" "${debs[0]}" "${appimages[0]}"

      - name: What the AppImage's notices now list
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/appimage-notices/THIRD-PARTY-NOTICES.txt"
          wc -c src-tauri/resources/THIRD-PARTY-NOTICES.txt "$f"
          sed -n '/^6\. AppImage only:/,/^7\. AppImage licence texts/p' "$f" | grep -vE '^    usr/' | grep -E '^[^ ]|^  source:' || true
          echo '--- one entry in full:'
          sed -n '/^libwebkit2gtk-4\.1-0 /,/^$/p' "$f"

      - name: Upload the AppImage's notices (for review; the packages are not uploaded)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-third-party-notices
          path: ${{ runner.temp }}/appimage-notices/THIRD-PARTY-NOTICES.txt
          retention-days: 14
          if-no-files-found: error
