name: Linux packages

# Builds the real .deb on the PRs that can change it, exactly as release.yml's
# build-linux does, and runs its post-bundle gate and the .deb's purge test.
#
# Linux ships the .deb only: owner decision 2026-10-28 (MR-2020, MR-2041,
# MR-2042) dropped the AppImage, whose bundled Ubuntu libraries (LGPL, and two
# GPL-only ones inside a CC-BY-NC app) brought source and licence duties the
# .deb, which uses the libraries already on the user's system, does not. This
# workflow used to build the AppImage too and prove its own notices against
# ubuntu-22.04's real packages; that went with it. The gate now refuses an
# AppImage, so bundle.targets cannot start building one again unnoticed.
#
# No secrets: the updater signing key is a THROWAWAY generated in the job
# (`tauri signer generate`), so the build is release.yml's command verbatim
# (updater artifacts on); no Sentry DSN (build.rs's release gate is waived
# with BIRDO_ALLOW_MISSING_SENTRY_DSN) and no attestation key. The package is
# never uploaded.
#
# Not a required check: path-filtered. No caches: nothing release-shaped
# restores what a PR wrote (as nsis-installer.yml).

# The two path lists are the same; keep them so. (Not a YAML anchor: zizmor
# warns that anchors can make its results wrong.)
on:
  pull_request:
    paths:
      - "src-tauri/**" # the app, Cargo.lock, tauri.conf.json, resources
      - "package.json"
      - "package-lock.json" # pins @tauri-apps/cli, i.e. the bundler
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/linux-deps/**"
      - ".github/workflows/linux-packages.yml"
      - ".github/workflows/release.yml" # the Xray pins are read from it
      - "scripts/ci/verify-bundled-xray.sh"
      - "scripts/generate-third-party-notices.mjs"
      - "scripts/lib/**"
      - "third_party/licenses/**"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/linux-deps/**"
      - ".github/workflows/linux-packages.yml"
      - ".github/workflows/release.yml"
      - "scripts/ci/verify-bundled-xray.sh"
      - "scripts/generate-third-party-notices.mjs"
      - "scripts/lib/**"
      - "third_party/licenses/**"
  # Weekly on main: the runner image's packages change without a commit here
  # (a security update moves a build dependency to a new version), and a
  # release should not be the first to notice.
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux-packages:
    name: Linux packages (ubuntu-22.04) - build the .deb, gate, purge
    # The schedule runs in this repository only, not in forks.
    if: github.event_name != 'schedule' || github.repository == 'BirdoVPN/Desktop-Client'
    # The image release.yml's build-linux runs on, so the .deb is built
    # against the same packages the release's is.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ARCH: x86_64-unknown-linux-gnu # what build-linux's matrix passes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No caches in this workflow (see the header).
          package-manager-cache: false

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies (the locked @tauri-apps/cli)
        run: npm ci

      # As build-linux: the tracked placeholder goes, xray is staged.
      - name: Fetch xray at release.yml's pins
        run: |
          set -euo pipefail
          rel=.github/workflows/release.yml
          pin() { sed -nE "s/^[[:space:]]*$1: ([0-9a-zA-Z.]+)$/\1/p" "$rel"; }
          version=$(pin XRAY_VERSION)
          zip="$RUNNER_TEMP/Xray-linux-64.zip"
          curl -fsSL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/$version/Xray-linux-64.zip" -o "$zip"
          echo "$(pin XRAY_LINUX_SHA256)  $zip" | sha256sum -c -
          unzip -q -o "$zip" -d "$RUNNER_TEMP/xray"
          mkdir -p src-tauri/resources
          rm -f src-tauri/resources/.gitkeep
          install -m 0755 "$RUNNER_TEMP/xray/xray" src-tauri/resources/xray
          sha=$(sha256sum src-tauri/resources/xray | cut -d' ' -f1)
          echo "XRAY_BINARY_SHA256=$sha" >> "$GITHUB_ENV"
          echo "Bundling Xray $version xray ($sha)"

      - name: Generate the third-party notices (resources/THIRD-PARTY-NOTICES.txt)
        run: |
          node scripts/generate-third-party-notices.mjs --release --target "$ARCH" \
            --xray src-tauri/resources/xray --xray-license "$RUNNER_TEMP/xray/LICENSE"

      # A THROWAWAY updater key, made here and gone with the runner - never
      # the real one, which a PR has no access to. With it the build below is
      # release.yml's command verbatim (updater artifacts on).
      - name: Make a throwaway updater signing key (not the release key)
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/throwaway-updater.key"
          npx tauri signer generate --ci -w "$key" -p "" >/dev/null
          test -s "$key" && test -s "$key.pub"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$key"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Build the .deb
        timeout-minutes: 25
        env:
          # A PR has no SENTRY_DSN, and these packages are never shipped.
          BIRDO_ALLOW_MISSING_SENTRY_DSN: "1"
        run: |
          set -euo pipefail
          # build-linux's command, verbatim.
          npx tauri build --target "$ARCH" -- --locked
          ls -la "src-tauri/target/$ARCH/release/bundle/deb"

      # release.yml's gate, verbatim.
      - name: Gate - the .deb alone; its bundled xray must hash to the compiled-in XRAY_BINARY_SHA256; THIRD-PARTY-NOTICES.txt must be this build's
        env:
          NOTICES_FILE: src-tauri/resources/THIRD-PARTY-NOTICES.txt
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$ARCH/release/bundle"
          shopt -s nullglob
          debs=("$bundle"/deb/*.deb)
          appimages=("$bundle"/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 0 ]; then
            echo "::error::found ${#appimages[@]} .AppImage under $bundle - Linux ships the .deb only (owner decision 2026-10-28); take \"appimage\" out of bundle.targets in tauri.conf.json"
            exit 1
          fi
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb under $bundle (found ${#debs[@]})"
            exit 1
          fi
          bash scripts/ci/verify-bundled-xray.sh "${XRAY_BINARY_SHA256:-}" "${debs[0]}"

      # MR-654: `apt purge` removes the app data BirdoVPN kept for root (the
      # .deb's postrm, src-tauri/linux/postrm.sh); `apt remove` keeps it. On
      # the real package: installed, its data planted in root's home with a
      # link to a folder outside it, removed (the data stays), then purged
      # (the data goes; the link's target and /var/lib/birdovpn stay).
      - name: The .deb's purge removes root's app data and follows no link
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("$PWD/src-tauri/target/$ARCH/release/bundle/deb"/*.deb)
          deb=${debs[0]}
          # The package carries the script (none did before MR-654).
          dpkg-deb --info "$deb" postrm
          pkg=$(dpkg-deb --field "$deb" Package)
          sudo apt-get install -y --no-install-recommends "$deb"

          home=$(getent passwd root | cut -d: -f6)
          data=(
            "$home/.config/BirdoVPN/birdo_pq_v1.bin"
            "$home/.config/BirdoVPN/device_id"
            "$home/.config/uk.birdo.vpn.desktop/settings.json"
            "$home/.config/uk.birdo.vpn.desktop/settings_hmac.key"
            "$home/.local/share/BirdoVPN/logs/birdo.log"
            "$home/.local/share/Birdo VPN/crashes/crash_1.txt"
            "$home/.local/share/uk.birdo.vpn.desktop/localstorage"
            "$home/.cache/uk.birdo.vpn.desktop/cache"
          )
          for f in "${data[@]}"; do
            sudo mkdir -p "$(dirname "$f")"
            echo fake | sudo tee "$f" >/dev/null
          done
          canary="$RUNNER_TEMP/purge-canary"
          mkdir -p "$canary"
          echo keep >"$canary/keep"
          sudo ln -s "$canary" "$home/.local/share/BirdoVPN/logs/planted"
          sudo mkdir -p /var/lib/birdovpn
          echo '{}' | sudo tee /var/lib/birdovpn/dns-restore.json >/dev/null
          there() { sudo test -e "$1" || sudo test -L "$1"; }

          sudo dpkg --remove "$pkg"
          for f in "${data[@]}"; do
            if ! there "$f"; then
              echo "::error::apt remove deleted $f (only a purge may)"
              exit 1
            fi
          done

          sudo dpkg --purge "$pkg"
          for f in "${data[@]}" "$home/.local/share/BirdoVPN" "$home/.config/BirdoVPN"; do
            if there "$f"; then
              echo "::error::$f survived the purge"
              exit 1
            fi
          done
          if [ "$(cat "$canary/keep")" != keep ]; then
            echo "::error::the purge followed the planted link"
            exit 1
          fi
          if ! sudo test -f /var/lib/birdovpn/dns-restore.json; then
            echo "::error::the purge deleted the DNS journal in /var/lib/birdovpn"
            exit 1
          fi
          echo "OK: the purge removed root's app data, followed no link and kept /var/lib/birdovpn"
