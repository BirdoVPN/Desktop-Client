name: Tests

# Runs the automated test suites on every push to main and every PR.
#
# WHY THIS EXISTS: the release build excludes `#[cfg(test)]` modules, so the
# Rust unit tests were never executed by CI - which is exactly how a
# duplicate-field compile error in a test module (birdo_pq.rs) survived on
# main undetected. This workflow runs `cargo test` (Windows - the supported
# launch target), the Linux/macOS compile + platform tests, and the frontend
# suite, so a broken test can never silently land again.
#
# Shape (2026-10-06 rebuild): every job is independent, so they all start at
# once and the slowest one sets the wall time. Rust caches are written by
# main only (`save-if`); PRs restore main's cache read-only. PR-scoped copies
# used to push the repo to 14 GB of caches (10 GB cap) and evict main's.
# Every cargo invocation is `--locked`: CI tests the exact dependency graph
# that Cargo.lock (and cargo-deny) describe, or fails.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # Every base branch, not only main: stacked PRs (e.g. #221/#222 on
  # overhaul/windows) get the same signal. No branch protection or required
  # checks exist on this repo; if required checks are ever added, replace
  # paths-ignore with a `changes` job so docs-only PRs still report.
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # One-shot CI builds gain nothing from incremental compilation (rust-cache
  # sets this too; the uncached MSRV jobs need it here).
  CARGO_INCREMENTAL: 0

jobs:
  # rustfmt + clippy, split from the test job so the two run in parallel.
  rust-lint:
    name: Rust lint (Windows) - rustfmt + clippy
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        # pwsh, not Git Bash: MSYS path conversion rewrites slash-arguments,
        # and RUSTFLAGS below carries /DELAYLOAD.
        shell: pwsh
    env:
      # Same flags as rust-tests (see there) so a local `cargo clippy` after
      # `cargo test` reuses the build; harmless for check-mode.
      RUSTFLAGS: "-C link-arg=/DELAYLOAD:comctl32.dll -C link-arg=delayimp.lib"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      # Lint first: it needs no compile, so formatting fails in seconds.
      - name: rustfmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context!() in main.rs requires the frontendDist dir
      # (../dist) to EXIST at macro-expansion time. This job does not build the
      # real frontend, so give the macro a stub. Without this, clippy on the
      # bin target panics with "frontendDist is set to ../dist but this path
      # doesn't exist".
      - name: Stub frontend dist for macro expansion
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>stub</title>'

      # Validated against the pinned toolchain, so local == CI results.
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-tests:
    name: Rust unit tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh # see rust-lint: RUSTFLAGS carries /DELAYLOAD
    env:
      # The shipping app binary gets the ComCtl32 v6 manifest dependency via
      # tauri-build (app.manifest), so it loads ComCtl32 v6 - where
      # TaskDialogIndirect lives (pulled in transitively by a native-dialog
      # crate). The unit-TEST binary gets no such manifest, so that import
      # binds against ComCtl32 v5, the function is absent, and the harness
      # fails to even start: STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) - on
      # every Windows machine, including clean runners (which is why the suite
      # never ran). Delay-load comctl32 so the symbol binds lazily; unit tests
      # never raise a task dialog. Scoped to CI test builds only - the app
      # build is untouched. (cargo has no `rustc-link-arg-tests` build-script
      # instruction, so this is RUSTFLAGS rather than build.rs.)
      RUSTFLAGS: "-C link-arg=/DELAYLOAD:comctl32.dll -C link-arg=delayimp.lib"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Stub frontend dist for macro expansion
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>stub</title>'

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib

      # The privacy pins (P6-CLI-D-09/10/11) live in tests/privacy_pins.rs, an
      # INTEGRATION target. `cargo test --lib` does not run integration targets
      # and `cargo check --all-targets` only compiles them - so from the day
      # they were written until 2026-09-19 these four assertions had never once
      # executed, in any job, on any branch. They are the tests that prove the
      # crash reporter and panic hook sanitise before writing, that the xray
      # config carries no access log and no sniffing, and that the attestation
      # module has no fingerprint source: exactly the claims the trust pages
      # make. A gate that never runs is a comment.
      - name: Run Rust privacy-pin tests (integration target)
        working-directory: src-tauri
        run: cargo test --locked --test privacy_pins

  # Cross-platform compile guard. The Windows jobs above only compile the
  # Windows cfg branches, so Linux/macOS-only code (`#[cfg(target_os = ...)]`
  # blocks, and shared code that calls Windows-only modules like vpn::wfp) was
  # NEVER compiled until a release tag built those platforms - which is how four
  # cross-platform breaks (an ungated wfp:: call in the shipped leak fix, a
  # macOS str_as_str, an Intel cross-target, a release asset collision) reached
  # release. `cargo check` (no bundling, no run) is fast and catches them on PRs.
  cross-check:
    name: Cross-platform compile check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          # macOS 26 = what macos-latest resolved to before this pin; the
          # runtime tests below (pfctl, routes) then run on the newest macOS.
          - runner: macos-26
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        uses: ./.github/actions/linux-deps

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # generate_context!() needs ../dist to exist at macro-expansion time.
      - name: Stub frontend dist for macro expansion
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html

      # PQ dependency + feature gate. Runs on Linux only (once per PR is
      # enough; the answer is host-independent) and BEFORE the clippy step.
      #
      # WHY: `zeroize` is what makes ml-kem's DecapsulationKey ZeroizeOnDrop
      # (ml-kem-0.3.2/src/decapsulation_key.rs:142,156 gate `impl Drop` and
      # `impl ZeroizeOnDrop` on that feature), and nothing asserted it. Review
      # of #163 changed the dependency to `features = ["alloc"]` and all 15
      # crypto tests still passed - no test can observe a Drop that did not
      # happen - so a Dependabot bump or a refactor could disarm every
      # decapsulation-key wipe with a green build. Mobile-Client has
      # scripts/check_pq_features.sh for exactly this; Desktop-Client had no
      # equivalent. The script also holds the exact `=0.3.2` pin, keeps the
      # pqcrypto/PQClean C trio out (RUSTSEC-2026-0161/-0162/-0163), and
      # enforces by hand the invariant the `hazmat` feature was wrongly
      # believed to enforce: `encapsulate_deterministic` stays inside the
      # #[cfg(test)] module.
      - name: PQ dependency + feature gate
        if: matrix.os == 'linux'
        run: ./scripts/ci/check-pq-features.sh

      # Clippy on the Linux/macOS cfg code (tunnel_linux.rs, tunnel_macos.rs,
      # ...), which the Windows rust-lint job never compiles, with the
      # MSRV-gated lints keyed off Cargo.toml's rust-version. Clippy is a
      # superset of `cargo check`, so this is still this job's compile guard:
      # a compile error fails the step.
      #
      # WARN-ONLY for now, deliberately: its first run (PR #223) found 12
      # (Linux) / 11 (macOS) pre-existing warnings - cfg-gated dead code and
      # unused variables in shared code, too_many_arguments, and small lints in
      # the tunnel files that the open stacked PRs #220-#222 are rewriting.
      # They are listed in #223 as a follow-up; once fixed, add
      # `-- -D warnings` here to match the Windows job. Until then the count
      # and every warning are surfaced as an annotation + step summary.
      - name: cargo clippy (all targets; warn-only, see comment) - also the compile check
        working-directory: src-tauri
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --message-format=short 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          # One line per distinct `file:line:col: warning: ...` (the lib and
          # lib-test builds report the same sites; cargo's own "generated N
          # warnings" summary lines have no file prefix and are not counted).
          grep -E '^[^ ]+:[0-9]+:[0-9]+: warning: ' "$RUNNER_TEMP/clippy.log" | sort -u > "$RUNNER_TEMP/clippy-warnings.txt" || true
          n=$(wc -l < "$RUNNER_TEMP/clippy-warnings.txt" | tr -d ' ')
          {
            echo "### clippy on $OS: $n distinct warning(s) (warn-only; follow-up in PR #223)"
            echo '```'
            cat "$RUNNER_TEMP/clippy-warnings.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::warning::clippy on $OS: $n distinct warning(s) in the $OS cfg code (warn-only until the PR #223 follow-up; listed in the job summary)"
          fi

      # The DNS crash-recovery journal is the only record of the user's
      # pre-connect resolvers, so it must survive a restore that did not land.
      # Run UNPRIVILEGED on purpose: an unprivileged relaunch (there is no
      # self-elevation off Windows) is exactly the case that used to delete it.
      #
      # BOTH Unix platforms, and that is the point of the matrix expression.
      # tunnel_macos.rs is `#[cfg(target_os = "macos")]`, so its tests are not
      # even COMPILED by the Windows job that runs `cargo test`, and this job
      # used to run `cargo check` alone on macOS - so every macOS test in the
      # repo, including the one named for the regression this whole change
      # exists to stop, executed in no job at all. A test nothing runs is not
      # coverage, it is a comment that costs a compile.
      - name: DNS journal restore + TUN read tests (Linux + macOS)
        working-directory: src-tauri
        env:
          OS: ${{ matrix.os }}
          # Linux: resolv_conf_restore_tests + tun_read_tests (F6: the packet
          # loop's buffer-reuse helper, run on a pipe fd). macOS:
          # dns_journal_restore_tests (restore_services_pass,
          # interpret_dns_query, dns_write_verified). Space-separated: libtest
          # runs every test matching ANY of the filters after `--`.
          FILTER: ${{ matrix.os == 'macos' && 'dns_journal_restore_tests endpoint_route_tests' || 'resolv_conf_restore_tests tun_read_tests' }}
          # The cfg-gated file those tests live in.
          SRC: ${{ matrix.os == 'macos' && 'src/vpn/tunnel_macos.rs' || 'src/vpn/tunnel_linux.rs' }}
          # Every test module in $SRC that some step of THIS job executes -
          # FILTER plus the root-only ipv6 step further down, whose tests are
          # #[ignore]d and so cannot run in the loop above.
          COVERED: ${{ matrix.os == 'macos' && 'dns_journal_restore_tests endpoint_route_tests' || 'configure_ipv6_tests ipv6_leak_block_tests resolv_conf_restore_tests tun_read_tests' }}
        run: |
          set -euo pipefail
          # $FILTER/$COVERED are space-separated lists; split them explicitly
          # (libtest ORs several name filters).
          read -r -a filters <<<"$FILTER"
          read -r -a covered_list <<<"$COVERED"
          # Captured, not piped: a name filter that matches NOTHING still exits
          # 0, which is a green light for a test suite that never ran.
          out=$(cargo test --locked --lib -- "${filters[@]}")
          echo "$out"
          if ! echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed'; then
            echo "::error::no tests ran on $OS - the filter '$FILTER' matched nothing"
            exit 1
          fi
          # Each named module must have run at least one test, or a typo in
          # one filter hides behind the other's passes.
          for f in "${filters[@]}"; do
            if ! echo "$out" | grep -qE "^test [a-z0-9_:]*${f}::[a-z0-9_]+ \.\.\. ok"; then
              echo "::error::filter '$f' matched no passing test on $OS"
              exit 1
            fi
          done

          # Completeness, checked rather than asserted in a comment.
          #
          # $SRC is compiled by NO other job: the Windows job is the only one
          # that runs `cargo test`, and it cannot even build these cfg-gated
          # files. So a test module in $SRC that no step here names runs in no
          # job at all - a comment that costs a compile. That is exactly the
          # state every macOS test in this repo was in, including the one named
          # for the regression this workflow step exists to protect, so the rule
          # gets a checker instead of a promise.
          declared=$(grep -oE '^mod [a-z0-9_]+_tests' "$SRC" | awk '{print $2}' | sort | tr '\n' ' ')
          covered=$(printf '%s\n' "${covered_list[@]}" | sort | tr '\n' ' ')
          if [ "$declared" != "$covered" ]; then
            echo "::error::$SRC declares test modules [$declared] but this job executes [$covered] - the difference runs in NO CI job. Add it to FILTER/COVERED."
            exit 1
          fi
          echo "OK - every test module in $SRC is executed by this job: $covered"

      # -- F-001 verification ------------------------------------------------
      # The IPv6 leak fix is kernel-firewall code that a Windows dev box cannot
      # exercise at all, and full leak-testing needs a dual-stack network we do
      # not have. These steps verify everything that CAN be verified without
      # one, on the real OS, on every push.

      # macOS: parse-check the EXACT ruleset bytes we ship. A pf syntax error
      # here would fail every macOS connect, and pfctl is the only thing that can
      # tell us. `-n` parses without loading, so this never touches the runner's
      # own firewall. Both variants are checked, including the fallback that
      # exists precisely for when `load anchor` fails.
      - name: pf ruleset parse-check (macOS)
        if: matrix.os == 'macos'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          for f in resources/pf/ipv6-block.conf resources/pf/ipv6-block-minimal.conf; do
            echo "-- pfctl -n -f $f"
            sudo pfctl -n -f "$f"
            echo "   OK"
          done
          # Guard the property the whole design rests on: these rulesets must
          # never mention inet/IPv4. pf's implicit default is pass, so an
          # inet6-only ruleset cannot break IPv4 - that is what makes loading it
          # as the MAIN ruleset safe for a whole session.
          if grep -nE '\binet\b' resources/pf/*.conf; then
            echo "::error::pf leak-block ruleset references IPv4 - it could break IPv4 connectivity"
            exit 1
          fi

      # Linux: run the real install/remove functions against real ip6tables as
      # root, asserting the chain, the OUTPUT jump, the default-deny, that NDP
      # stays permitted, that repeat installs don't stack, and that teardown
      # leaves nothing behind (a stuck chain = host with no IPv6).
      - name: IPv6 leak-block functional test (Linux, root)
        if: matrix.os == 'linux'
        working-directory: src-tauri
        run: sudo -E "$(command -v cargo)" test --locked --lib ipv6_leak_block_tests -- --ignored --nocapture

      # F-008 macOS: the ONE tolerated route failure, proven rather than
      # asserted in a comment. The owner has no Mac, so this runner is the only
      # place it can run. It installs a route to TEST-NET-1 and removes it.
      - name: Endpoint-route tolerated-duplicate test (macOS, root)
        if: matrix.os == 'macos'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          out=$(sudo -E "$(command -v cargo)" test --locked --lib endpoint_route_tests -- --ignored --nocapture --test-threads=1)
          echo "$out"
          if ! echo "$out" | grep -qE 'test result: ok\. 1 passed'; then
            echo "::error::the macOS endpoint-route root test did not run"
            exit 1
          fi

      # configure_ipv6() itself, which until this step had NEVER EXECUTED - not
      # in CI, not on a dev box, not anywhere. Every Linux and Windows
      # single-hop connect calls it for real since route failures became fatal,
      # so without this the first execution would have been a customer's.
      #
      # A dummy interface reaches everything except egress: that the function
      # runs, that it installs ::/1 + 8000::/1 rather than a ::/0, that the
      # host's own default survives, that the kernel agrees the tunnel won, and
      # that a collision on one half is REFUSED rather than swallowed. Proving
      # IPv6 traffic actually leaves through the tunnel still needs the bench on
      # a dual-stack line; this is the part that does not.
      - name: configure_ipv6 route-shape tests (Linux, root)
        if: matrix.os == 'linux'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          # --test-threads=1 is load-bearing, not tidiness. Both tests touch
          # GLOBAL routing state - ::/1 is ::/1 whichever device claims it - so
          # run in parallel they contend over the same prefix and fail for a
          # reason that has nothing to do with the code under test.
          out=$(sudo -E "$(command -v cargo)" test --locked --lib configure_ipv6_tests -- --ignored --nocapture --test-threads=1)
          echo "$out"
          # Two tests, both required. An --ignored filter that matches nothing
          # still exits 0, which is the exact failure this repo has been bitten
          # by before: a green job proving only that a filter typo compiled.
          if ! echo "$out" | grep -qE 'test result: ok\. 2 passed'; then
            echo "::error::configure_ipv6_tests did not run both tests"
            exit 1
          fi

  # The declared MSRV (src-tauri/Cargo.toml `rust-version`, read here so the
  # two cannot drift) must really build. It is also a clippy input: clippy's
  # MSRV-gated lints key off it, so a fictional value silently changes which
  # lints fire. Nothing compiled at it until 2026-10-06, when it said 1.85
  # while the locked graph already needed 1.88 (time 0.3.53, sentry 0.49,
  # plist 1.10, darling 0.23, serde_with 3.22). `cargo check` only. The Windows
  # leg is cached (main writes, PRs read); see the cache step for why only it.
  msrv:
    name: MSRV check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: windows-2025
            os: windows
          - runner: macos-26
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        uses: ./.github/actions/linux-deps

      - name: Stub frontend dist for macro expansion
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html

      - name: Install the declared rust-version toolchain
        working-directory: src-tauri
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error::src-tauri/Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "Declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          # Every later step (rust-cache's key, cargo) uses the MSRV toolchain,
          # not the 1.96 that rust-toolchain.toml would otherwise select.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      # Windows only: uncached, its leg took 4-6 min and would set the
      # workflow's critical path; the Linux/macOS legs (2.5-3.5 min) stay
      # uncached to spare two ~0.5 GB entries of the 10 GB cache budget.
      - name: Rust cache
        if: matrix.os == 'windows'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: msrv-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check --locked --all-targets at the declared rust-version
        working-directory: src-tauri
        run: |
          rustc --version
          cargo check --locked --all-targets

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:run

      # The production bundle. Until 2026-09-17 nothing on a PR ran `vite build`
      # - this job stopped at lint/type-check/vitest, and the bundle was only
      # ever produced by release.yml's `npx tauri build`. So a vite config that
      # breaks ONLY at bundle time surfaced as a red RELEASE, not a red PR. The
      # concrete case: Dependabot's vite 8 bump (#164) kept `minify: 'esbuild'`
      # while vite 8 dropped esbuild, and vitest never exercises the minifier
      # (the plugin is gated on isBuild), so that PR would have gone green and
      # the next tag would have failed inside `vite build`. ~10s here saves a
      # burned release.
      - name: Production bundle builds
        run: npm run build

      # The release's tauri build commands, read FROM release.yml so this
      # contract cannot drift from it: every one must end in `-- --locked`,
      # and the Linux/macOS form, run verbatim with an `echo` runner standing
      # in for cargo and the frontend build switched off (nothing compiles),
      # must hand --locked to cargo. The Windows form runs in
      # release-cli-contract below, under pwsh.
      - name: Release build commands pass --locked through to cargo (bash, read from release.yml)
        env:
          RUSTUP_TOOLCHAIN: stable # the CLI's own `cargo metadata` only
          ARCH: x86_64-unknown-linux-gnu # what build-linux's matrix passes
        run: |
          set -euo pipefail
          mapfile -t cmds < <(sed -n 's/^ *run: \(npx tauri build.*\)$/\1/p' .github/workflows/release.yml)
          echo "release.yml build commands: ${#cmds[@]}"
          if [ "${#cmds[@]}" -lt 2 ]; then
            echo "::error::found ${#cmds[@]} 'run: npx tauri build ...' lines in release.yml; expected the Windows, Linux and macOS ones"
            exit 1
          fi
          for c in "${cmds[@]}"; do
            case "$c" in
              *' -- --locked') echo "  ok: $c" ;;
              *) echo "::error::release.yml builds without a trailing '-- --locked': $c"; exit 1 ;;
            esac
          done
          unix_cmd=$(printf '%s\n' "${cmds[@]}" | grep -e '--target' | sort -u)
          if [ -z "$unix_cmd" ] || [ "$(printf '%s\n' "$unix_cmd" | wc -l)" -ne 1 ]; then
            echo "::error::expected ONE Linux/macOS build command form in release.yml, got: $unix_cmd"
            exit 1
          fi
          printf '%s' '{"build":{"beforeBuildCommand":""}}' > "$RUNNER_TEMP/no-frontend.json"
          probe="npx tauri build --runner echo --no-bundle --config \"\$RUNNER_TEMP/no-frontend.json\"${unix_cmd#npx tauri build}"
          echo "probe: $probe"
          # tauri's own exit code is irrelevant (it is 0 with --no-bundle);
          # the gate is the grep on the command line cargo would receive.
          rc=0
          out=$(eval "$probe" 2>&1) || rc=$?
          echo "$out"
          echo "(tauri exited $rc; not the gate)"
          if ! printf '%s\n' "$out" | grep -qE '^build .*--locked'; then
            echo "::error::release.yml's Linux/macOS build command did not hand --locked to cargo"
            exit 1
          fi
          echo "OK: cargo receives --locked"

  # The Windows twin of the step above, in the release's own shell. Under
  # pwsh `npx` is the npx.ps1 shim, and a PowerShell script can swallow a bare
  # `--`; if it did, build-windows' `npx tauri build -- --locked` would build
  # without --locked (or fail) on the first tag. Nothing else exercises that
  # command line before a release, so this does, in about a minute.
  release-cli-contract:
    name: Release build command passes --locked to cargo (Windows, pwsh)
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh # release.yml build-windows runs `npx tauri build` under pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: build-windows' tauri build command, read from release.yml and run verbatim
        env:
          RUSTUP_TOOLCHAIN: stable # the CLI's own `cargo metadata` only
        run: |
          # The Windows command is the one `run: npx tauri build ...` line in
          # release.yml without --target; drift there now changes what runs here.
          $cmds = @(Select-String -Path .github/workflows/release.yml -Pattern '^\s*run: (npx tauri build.*)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() })
          $win = @($cmds | Where-Object { $_ -notmatch '--target' } | Sort-Object -Unique)
          if ($win.Count -ne 1) {
            Write-Host "::error::expected ONE Windows 'run: npx tauri build ...' line in release.yml, found $($win.Count): $($win -join ' | ')"
            exit 1
          }
          Write-Host "build-windows runs: $($win[0])"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $cfg = "$env:RUNNER_TEMP\no-frontend.json"
          $runner = "$env:RUNNER_TEMP\echo-args.cmd"
          Set-Content -Path $cfg -Value '{"build":{"beforeBuildCommand":""}}'
          # A runner that prints the arguments cargo would have received.
          Set-Content -Path $runner -Value '@echo %*'
          $rest = $win[0].Substring('npx tauri build'.Length)
          $probe = "npx tauri build --runner `"$runner`" --no-bundle --config `"$cfg`"$rest"
          Write-Host "probe: $probe"
          # Parsed by pwsh exactly as the release step's script is, so npx.ps1
          # sees the same tokens. tauri's own exit code is irrelevant (0 with
          # --no-bundle); the gate is the match on the line cargo would receive.
          $out = Invoke-Expression "$probe 2>&1" | Out-String
          Write-Host $out
          Write-Host "(tauri exited $LASTEXITCODE; not the gate)"
          if ($out -notmatch '(?m)^build .*--locked') {
            Write-Host "::error::npx tauri build -- --locked under pwsh did not hand --locked to cargo"
            exit 1
          }
          Write-Host "OK: cargo receives --locked through npx under pwsh"
          exit 0

  # OPEN-WORK F4: self-test of the release pipeline's Windows post-bundle xray
  # gate. release.yml build-windows runs scripts/ci/verify-bundled-xray-hash.ps1
  # against the produced NSIS installer and fails the release unless the
  # bundled resources\xray.exe hashes to the compiled-in XRAY_BINARY_SHA256
  # (v1.4.40 and v1.4.41 shipped with a mismatch - Authenticode rewrote the
  # file after the hash was captured - and nothing noticed). A gate that can
  # be edited into a no-op is worse than none, so every PR proves each of its
  # failure paths still fails, using fake installers 7z extracts like NSIS.
  xray-gate-selftest:
    name: Bundled-xray hash gate self-test (Windows)
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the gate against fake installers (pass + must-fail scenarios)
        shell: pwsh
        run: ./scripts/ci/verify-bundled-xray-hash.tests.ps1

  # The macOS + Linux twin of the job above (register MR-720/MR-736):
  # release.yml now gates the .app, the updater .app.tar.gz, the .dmg, the
  # .deb and the AppImage with scripts/ci/verify-bundled-xray.sh. The Linux
  # leg runs the .deb scenarios (dpkg-deb), the macOS leg the .dmg ones
  # (hdiutil); both run the rest. The real-package path was verified against
  # the published v1.4.45 artifacts when the gate was written.
  xray-gate-selftest-unix:
    name: Bundled-xray gate self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          # The image release.yml builds the macOS packages on.
          - runner: macos-15
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the gate against fake packages (pass + must-fail scenarios)
        run: bash scripts/ci/verify-bundled-xray.tests.sh

  # Version-consistency gate. The app version is declared in THREE places:
  # package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml
  # ([package] version). The in-app updater matches installed-vs-release by
  # exact string, so any drift ships a client that either can't self-update or
  # loops re-installing. Fail the build the moment they disagree. Node is the
  # repo's lingua franca - it parses the two JSON files natively and we pull
  # [package].version out of the TOML with a scoped regex (no TOML dep needed).
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert package.json / tauri.conf.json / Cargo.toml versions match
        run: |
          node <<'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const conf = JSON.parse(
            fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'),
          ).version;

          // Extract the [package] table's `version = "..."` from Cargo.toml,
          // scoped to that table so a dependency's `version = ...` can't match.
          const toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const pkgTable = toml
            .split(/^\[/m)
            .find((s) => s.startsWith('package]'));
          const m = pkgTable && pkgTable.match(/^\s*version\s*=\s*"([^"]+)"/m);
          const cargo = m ? m[1] : undefined;

          const versions = {
            'package.json': pkg,
            'src-tauri/tauri.conf.json': conf,
            'src-tauri/Cargo.toml [package]': cargo,
          };
          console.log('Detected versions:', JSON.stringify(versions, null, 2));

          const unique = [...new Set(Object.values(versions))];
          if (unique.length !== 1 || !unique[0]) {
            console.error(
              '::error::App version strings disagree across sources of truth: ' +
                JSON.stringify(versions),
            );
            process.exit(1);
          }
          console.log('OK - all version strings match: ' + unique[0]);
          EOF

      # Every Tauri plugin is TWO packages - a Rust crate and its npm twin -
      # and `tauri build` refuses to run when a pair's major.minor differ
      # ("Found version mismatched Tauri packages"). Dependabot bumps the two
      # ecosystems in separate PRs, so a merged cargo group can leave npm
      # behind; nothing here ran `tauri build`, so the v1.4.41 tag (2026-09-13)
      # was the first thing to notice: all four platform builds failed on
      # updater 2.11 vs 2.9 and dialog 2.7 vs 2.6. Same defect as 1194757 a
      # release earlier. This applies the CLI's own rule on every PR.
      - name: Assert Tauri crate / npm package pairs share major.minor
        run: |
          node <<'EOF'
          const fs = require('fs');
          const lock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');
          const npm = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages;

          const crates = {};
          for (const m of lock.matchAll(/name = "(tauri(?:-plugin-[a-z0-9-]+)?)"\r?\nversion = "([^"]+)"/g)) {
            crates[m[1]] = m[2];
          }
          const npmName = (crate) =>
            crate === 'tauri' ? '@tauri-apps/api' : '@tauri-apps/plugin-' + crate.slice('tauri-plugin-'.length);
          const minor = (v) => v.split('.').slice(0, 2).join('.');

          const rows = [];
          let bad = 0;
          for (const [crate, cv] of Object.entries(crates).sort()) {
            const n = npmName(crate);
            const entry = npm['node_modules/' + n];
            if (!entry) { rows.push(`${crate} ${cv}  (no npm twin installed - fine)`); continue; }
            const ok = minor(cv) === minor(entry.version);
            if (!ok) bad++;
            rows.push(`${crate} ${cv}  <->  ${n} ${entry.version}  ${ok ? 'OK' : 'MISMATCH'}`);
          }
          console.log(rows.join('\n'));
          if (bad) {
            console.error(`::error::${bad} Tauri crate/npm pair(s) differ in major.minor - \`tauri build\` will refuse. Bump the lagging side (both lockfiles) in the same PR.`);
            process.exit(1);
          }
          console.log('OK - every Tauri crate/npm pair shares major.minor');
          EOF
