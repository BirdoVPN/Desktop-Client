name: Tests

# Runs the automated test suites on every push to main and every PR.
#
# WHY THIS EXISTS: the build-* workflows only ever *build* the app (release
# bundle). Building excludes `#[cfg(test)]` modules, so the Rust unit tests were
# never executed by CI — which is exactly how a duplicate-field compile error in
# a test module (birdo_pq.rs) survived on main undetected. This workflow runs
# `cargo test` (Windows — the supported launch target) and the frontend vitest
# suite so a broken test can never silently land again.
#
# Linux is intentionally NOT run here: Windows is the supported launch target
# and the GTK/WebKit system-dev packages make the job slow for little signal.
# (The old 1.83-vs-edition2024 blocker is gone — the pin is 1.96 now.)
# macOS/iOS are descoped for this launch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # rust-toolchain.toml pins the channel (1.96); this action just ensures a
      # toolchain is present so the pin resolves.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      # tauri::generate_context!() in main.rs requires the frontendDist dir
      # (../dist) to EXIST at macro-expansion time. The lint/test job doesn't
      # build the real frontend (that's the release workflow's job), so give
      # the macro a stub. Without this, clippy on the bin target panics with
      # "frontendDist is set to ../dist but this path doesn't exist".
      - name: Stub frontend dist for macro expansion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>stub</title>'

      # Lint gates: keep the public repo rustfmt-clean and clippy-clean.
      # (Validated against the pinned toolchain, so local == CI results.)
      - name: rustfmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=/DELAYLOAD:comctl32.dll -C link-arg=delayimp.lib"
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests
        working-directory: src-tauri
        # The shipping app binary gets the ComCtl32 v6 manifest dependency via
        # tauri-build (app.manifest), so it loads ComCtl32 v6 — where
        # TaskDialogIndirect lives (pulled in transitively by a native-dialog
        # crate). The unit-TEST binary gets no such manifest, so that import binds
        # against ComCtl32 v5, the function is absent, and the harness fails to
        # even start: STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) — on every Windows
        # machine, including clean runners (which is why the suite never ran).
        # Delay-load comctl32 so the symbol binds lazily; unit tests never raise a
        # task dialog. Scoped to THIS job's build only — the app build is untouched.
        # (cargo has no `rustc-link-arg-tests` build-script instruction, so we
        #  use RUSTFLAGS here rather than build.rs.)
        env:
          RUSTFLAGS: "-C link-arg=/DELAYLOAD:comctl32.dll -C link-arg=delayimp.lib"
        run: cargo test --lib

  # Cross-platform compile guard. The rust-tests job above only compiles the
  # Windows cfg branches, so Linux/macOS-only code (`#[cfg(target_os = ...)]`
  # blocks, and shared code that calls Windows-only modules like vpn::wfp) was
  # NEVER compiled until a release tag built those platforms — which is how four
  # cross-platform breaks (an ungated wfp:: call in the shipped leak fix, a
  # macOS str_as_str, an Intel cross-target, a release asset collision) reached
  # release. `cargo check` (no bundling, no run) is fast and catches them on PRs.
  cross-check:
    name: Cross-platform compile check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # generate_context!() needs ../dist to exist at macro-expansion time.
      - name: Stub frontend dist for macro expansion
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html

      - name: cargo check (all targets)
        working-directory: src-tauri
        run: cargo check --all-targets

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:run

  # Version-consistency gate. The app version is declared in THREE places:
  # package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml
  # ([package] version). The in-app updater matches installed-vs-release by
  # exact string, so any drift ships a client that either can't self-update or
  # loops re-installing. Fail the build the moment they disagree. Node is the
  # repo's lingua franca — it parses the two JSON files natively and we pull
  # [package].version out of the TOML with a scoped regex (no TOML dep needed).
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Assert package.json / tauri.conf.json / Cargo.toml versions match
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const conf = JSON.parse(
            fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'),
          ).version;

          // Extract the [package] table's `version = "..."` from Cargo.toml,
          // scoped to that table so a dependency's `version = ...` can't match.
          const toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const pkgTable = toml
            .split(/^\[/m)
            .find((s) => s.startsWith('package]'));
          const m = pkgTable && pkgTable.match(/^\s*version\s*=\s*"([^"]+)"/m);
          const cargo = m ? m[1] : undefined;

          const versions = {
            'package.json': pkg,
            'src-tauri/tauri.conf.json': conf,
            'src-tauri/Cargo.toml [package]': cargo,
          };
          console.log('Detected versions:', JSON.stringify(versions, null, 2));

          const unique = [...new Set(Object.values(versions))];
          if (unique.length !== 1 || !unique[0]) {
            console.error(
              '::error::App version strings disagree across sources of truth: ' +
                JSON.stringify(versions),
            );
            process.exit(1);
          }
          console.log('OK — all version strings match: ' + unique[0]);
          EOF
