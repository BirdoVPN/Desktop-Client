# ============================================================================
# UNIFIED release workflow — Windows + Linux + macOS build TOGETHER and
# publish into ONE draft GitHub Release from a SINGLE tag (v*.*.* e.g. v1.4.16).
#
# This superseded the three separate per-platform pipelines
# (build-windows.yml, build-linux.yml, build-macos.yml). All three are GONE:
# build-macos.yml first, build-windows.yml and build-linux.yml on 2026-09-13
# (OPEN-WORK F16) — they had lost their tag triggers but still carried full
# build+sign+release steps that nothing exercised, a second release path to
# keep in step by hand. This file is the only release pipeline; for a manual
# single-platform build use workflow_dispatch here.
#
# Each build job below started as a faithful copy of the corresponding job
# from the file it replaced (same steps, pinned action SHAs, env,
# signing/attestation behaviour).
# ============================================================================

name: Release (Windows + Linux + macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.4.16)'
        required: true
        type: string
      # OPEN-WORK F4: Authenticode used to run ONLY on tag builds, so the
      # sign-xray-before-hash step and the post-bundle xray gate below could
      # never be exercised without cutting a real tag. This flag turns the
      # signed Windows path on for a dispatch run from any branch; dispatch
      # runs still never publish a release (see the `release` job), and the
      # attestation-key requirement stays tag-only. Needs the Azure federated
      # credential to admit the dispatched ref (it is configured for tags;
      # if OIDC login fails on a branch, that is the credential's subject
      # filter, not this workflow).
      authenticode_dry_run:
        description: 'Windows: run the Authenticode path (sign xray.exe before hashing + verify the bundled hash) on this non-tag build'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

# Minimum permissions — each job declares its own
permissions: {}

# One run per ref, never cancelled mid-build/sign/publish. Tag refs are
# unique, so two tags build in parallel; the `release` job's Latest guard
# below keeps their publishes from moving GitHub "Latest" backwards. This
# group cannot collide with a CI group (those are `<workflow>-<PR or ref>`).
#
# Merging to main never starts this workflow: it has no branch trigger, only
# tag pushes (v*) and manual dispatch, and a dispatch never publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# NO CACHES anywhere in this workflow (no rust-cache, no setup-node cache):
# a cache a PR or a main-branch run wrote must never feed a build that is
# signed and published (zizmor cache-poisoning). It cost nothing measurable:
# a tag run can only read caches from its own tag or main, so all five
# rust-cache steps reported "No cache found" on v1.4.45 anyway.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # dtolnay/rust-toolchain exported this into every job; keep it now that the
  # local setup-rust action replaces it. (Release-profile builds are never
  # incremental anyway; this keeps the test gate's dev build as before.)
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  XRAY_VERSION: v26.3.27
  XRAY_WINDOWS_SHA256: d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad
  XRAY_LINUX_SHA256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
  XRAY_MACOS_ARM64_SHA256: 2e93a67e8aa1936ecefb307e120830fcbd4c643ab9b1c46a2d0838d5f8409eaf
  XRAY_MACOS_AMD64_SHA256: f5b0471d3459eff1b82e48af0aeac186abcc3298210070afbbbd8437a4e8b203

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # TEST GATE — a release must never BUILD or PUBLISH if tests fail.
  #
  # WHY THIS EXISTS: before this job, release.yml only ever *built* the app.
  # Building excludes `#[cfg(test)]` modules, so a tag push shipped installers
  # whose Rust unit tests were never run on that ref (tests.yml gates PRs and
  # pushes to main, but a tag push does not re-run it). This job mirrors
  # tests.yml (Rust unit tests on Windows + the frontend vitest suite); the
  # three build jobs below all `needs: test`, so a red test aborts the whole
  # release before a single installer is produced, and the final `release` job
  # refuses to publish unless this job succeeded.
  # ══════════════════════════════════════════════════════════════════════
  test:
    name: Test gate (Rust unit tests + frontend vitest)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        # Unchanged from before the workflow-level bash default: pwsh, so
        # RUSTFLAGS' /DELAYLOAD never meets Git Bash's path conversion.
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # P5-CICD-15: tag↔version gate. tests.yml's `version-consistency` job has
      # no tag trigger, so nothing ever compared a pushed tag against the source
      # versions: tagging v1.4.31 while the source still said 1.4.30 published
      # BirdoVPN_1.4.30_*-setup.exe under a v1.4.31 release — and the in-app
      # updater resolves the bundle by asset filename, so clients told "1.4.31
      # is available" would be served the 1.4.30 installer forever (a permanent,
      # errorless update loop). This step fails the whole release (every build
      # job `needs: test`) before a single installer is produced. It also
      # asserts the FOUR version sources agree — package.json, tauri.conf.json,
      # Cargo.toml [package] and Cargo.lock's own package entry (the one
      # historically missed) — and puts the previously unused workflow_dispatch
      # `version` input to work as the same gate for manual runs.
      - name: Gate tag / dispatch version against the source versions
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const conf = JSON.parse(
            fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'),
          ).version;

          // Extract the [package] table's `version = "..."` from Cargo.toml,
          // scoped to that table so a dependency's `version = ...` can't match
          // (same extraction as tests.yml's version-consistency job).
          const toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const pkgTable = toml
            .split(/^\[/m)
            .find((s) => s.startsWith('package]'));
          const m = pkgTable && pkgTable.match(/^\s*version\s*=\s*"([^"]+)"/m);
          const cargo = m ? m[1] : undefined;

          // Cargo.lock's own [[package]] entry: `cargo build` refreshes it in
          // the working tree, but only a committed bump ships it — a stale
          // entry means the release ref's lockfile disagrees with the manifest.
          const lock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');
          const lm = lock.match(
            /\[\[package\]\]\s*name = "birdo-vpn-desktop"\s*version = "([^"]+)"/,
          );
          const lockVer = lm ? lm[1] : undefined;

          const versions = {
            'package.json': pkg,
            'src-tauri/tauri.conf.json': conf,
            'src-tauri/Cargo.toml [package]': cargo,
            'src-tauri/Cargo.lock [[package]] birdo-vpn-desktop': lockVer,
          };
          console.log('Detected versions:', JSON.stringify(versions, null, 2));

          const unique = [...new Set(Object.values(versions))];
          if (unique.length !== 1 || !unique[0]) {
            console.error(
              '::error::App version strings disagree across sources of truth: ' +
                JSON.stringify(versions),
            );
            process.exit(1);
          }
          const version = unique[0];

          const ref = process.env.REF || '';
          const refName = process.env.REF_NAME || '';
          if (ref.startsWith('refs/tags/v')) {
            if (refName !== 'v' + version) {
              console.error(
                `::error::Tag ${refName} does not match the source version ` +
                  `${version} (expected v${version}). Refusing to publish a ` +
                  'mislabeled release the updater would loop on forever.',
              );
              process.exit(1);
            }
            console.log(`OK — tag ${refName} matches source version ${version}`);
          } else if (process.env.DISPATCH_VERSION) {
            if (process.env.DISPATCH_VERSION !== version) {
              console.error(
                `::error::workflow_dispatch version input '` +
                  `${process.env.DISPATCH_VERSION}' does not match the source ` +
                  `version ${version}.`,
              );
              process.exit(1);
            }
            console.log(`OK — dispatch input matches source version ${version}`);
          } else {
            console.log('OK — all version strings match: ' + version);
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No npm cache: a release restores nothing a PR could have written
          # (zizmor cache-poisoning). Explicit, because setup-node v7 turns
          # caching on by itself once package.json declares a packageManager.
          package-manager-cache: false

      # rust-toolchain.toml pins the toolchain (1.96); install exactly that.
      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context!() in main.rs requires the frontendDist dir
      # (../dist) to EXIST at macro-expansion time. The test job doesn't build
      # the real frontend, so give the macro a stub (same as tests.yml).
      - name: Stub frontend dist for macro expansion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>stub</title>'

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run type-check

      - name: Frontend unit tests (vitest)
        run: npm run test:run

      - name: Run Rust unit tests
        working-directory: src-tauri
        # The unit-TEST binary gets no ComCtl32 v6 manifest (only the shipped app
        # gets one via tauri-build), so a transitive TaskDialogIndirect import
        # binds against ComCtl32 v5 (absent) and the harness aborts pre-main with
        # STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) on every Windows runner. Delay-
        # load comctl32 so the symbol binds lazily; unit tests never raise a task
        # dialog. Same workaround tests.yml uses; scoped to this job's build only.
        env:
          RUSTFLAGS: "-C link-arg=/DELAYLOAD:comctl32.dll -C link-arg=delayimp.lib"
        # --locked: test exactly the graph Cargo.lock (and cargo-deny) describe.
        run: cargo test --locked --lib

  # ══════════════════════════════════════════════════════════════════════
  # WINDOWS — began as a faithful copy of the retired build-windows.yml `build` job.
  # Authenticode (Azure OIDC Trusted Signing) + Sigstore + updater .sig.
  # ══════════════════════════════════════════════════════════════════════
  build-windows:
    needs: test  # never build/sign/publish on a red test suite
    runs-on: windows-2025
    timeout-minutes: 35  # Hard cap. Rust compile ~12m + signing ~3m. If we hit 35m, signing hung.
    # SENTRY_DSN lives at JOB level, not on the build step.
    #
    # It was on the step, which is correct for exactly as long as a job has one
    # build step — and release.yml's build-macos already has two (the signed
    # build and the unsigned fallback). A job-level env is the only form that
    # also covers a step somebody adds next year. Missing one build job is the
    # twin-drift defect this estate keeps re-finding, and a build with no DSN
    # now FAILS in build.rs rather than shipping an inert reporter.
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      # Azure OIDC login for Trusted Signing. (Sigstore signing happens once,
      # in the release job; this job publishes nothing, so no contents: write.)
      id-token: write
    defaults:
      run:
        shell: pwsh # unchanged: every unlabelled step here was pwsh before
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No npm cache: a release restores nothing a PR could have written
          # (zizmor cache-poisoning). Explicit, because setup-node v7 turns
          # caching on by itself once package.json declares a packageManager.
          package-manager-cache: false

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      # Lint, type-check and vitest ran in the `test` job this one needs, on
      # this same ref - not repeated here.
      - name: Install frontend dependencies
        run: npm ci

      # Download wintun.dll (gitignored — must be fetched at build time).
      # Supply-chain: the zip is verified against a pinned SHA-256 before any
      # file from it is used (same pattern as the Xray download below).
      - name: Download Wintun
        shell: pwsh
        run: |
          $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          # Official wintun-0.14.1.zip SHA-256 (verified against wireguard-windows'
          # embedded prerequisite hash). Bump together with the URL version.
          $expectedSha = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          $zipPath = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile $zipPath
          $actualSha = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            Write-Error "Wintun zip SHA-256 mismatch! expected=$expectedSha actual=$actualSha — refusing to bundle."
            exit 1
          }
          Write-Host "Wintun zip SHA-256 verified: $actualSha"
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\wintun"
          # Copy to resources/ for Tauri bundling
          New-Item -ItemType Directory -Force -Path "src-tauri/resources"
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" "src-tauri/resources/wintun.dll"
          # Also copy to wintun-extract for build.rs
          New-Item -ItemType Directory -Force -Path "src-tauri/wintun-extract/wintun/bin/amd64"
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" "src-tauri/wintun-extract/wintun/bin/amd64/wintun.dll"
          Write-Host "Wintun DLL ready ($(Get-Item src-tauri/resources/wintun.dll | Select-Object -ExpandProperty Length) bytes)"

      - name: Download pinned Xray Reality engine
        shell: pwsh
        run: |
          $xrayUrl = "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip"
          $zipPath = "$env:RUNNER_TEMP\xray-windows-64.zip"
          Invoke-WebRequest -Uri $xrayUrl -OutFile $zipPath
          $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:XRAY_WINDOWS_SHA256) {
            throw "Xray zip SHA256 mismatch. Expected $env:XRAY_WINDOWS_SHA256, got $actual"
          }
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\xray" -Force
          $xrayExe = Get-ChildItem "$env:RUNNER_TEMP\xray" -Recurse -Filter xray.exe | Select-Object -First 1
          if (-not $xrayExe) { throw "xray.exe not found in release archive" }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          Copy-Item $xrayExe.FullName "src-tauri/resources/xray.exe" -Force
          $binarySha = (Get-FileHash -Path "src-tauri/resources/xray.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          # PROVISIONAL on signed builds: the "Sign xray.exe BEFORE bundling"
          # step below re-captures XRAY_BINARY_SHA256 from the signed bytes.
          # Unsigned (PR/dispatch) builds ship exactly these bytes.
          "XRAY_BINARY_SHA256=$binarySha" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Xray ready: src-tauri/resources/xray.exe ($binarySha)"

      # ── Client attestation key (release builds only) ─────────────────
      # A tagged release MUST be able to attest itself: without the secret,
      # option_env! is None and the shipped client silently sends no signature,
      # which an `enforce` server policy refuses. Fail here rather than ship it.
      - name: Require the desktop attestation key on tag builds
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
        run: |
          if (-not $env:BIRDO_DESKTOP_ATTEST_SK) { throw "BIRDO_DESKTOP_ATTEST_SK secret is empty — a tagged release cannot ship unattestable. See docs/CLIENT-ATTESTATION.md" }
          if (-not $env:BIRDO_DESKTOP_ATTEST_KID) { throw "BIRDO_DESKTOP_ATTEST_KID secret is empty — a tagged release cannot ship unattestable. See docs/CLIENT-ATTESTATION.md" }
          Write-Host "Attestation key present (kid: $env:BIRDO_DESKTOP_ATTEST_KID)"

      # ── Authenticode signing setup (only on tag builds) ──────────────
      # Skip for PR/dispatch builds — those produce unsigned binaries that
      # are still Sigstore-signed. Only tagged releases get Authenticode.
      - name: Determine if this build should be Authenticode-signed
        id: sign-mode
        shell: pwsh
        env:
          AUTHENTICODE_DRY_RUN: ${{ inputs.authenticode_dry_run }}
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Tag build — Authenticode signing ENABLED"
          } elseif ($env:AUTHENTICODE_DRY_RUN -eq 'true') {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "workflow_dispatch authenticode_dry_run=true — Authenticode signing ENABLED on a non-tag build (no release is published)"
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Non-tag build — Authenticode signing DISABLED (Sigstore only)"
          }

      - name: Azure Login (OIDC) for Trusted Signing
        if: steps.sign-mode.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      # Install Microsoft.Trusted.Signing.Client (provides Azure.CodeSigning.Dlib.dll
      # which signtool.exe loads via the /dlib parameter to talk to Trusted Signing).
      - name: Install Trusted Signing Client tools
        if: steps.sign-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $pkgDir = "$env:RUNNER_TEMP\trusted-signing"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          # Pull the Microsoft.Trusted.Signing.Client NuGet package
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -OutputDirectory $pkgDir -ExcludeVersion
          $dlibPath = Get-ChildItem -Path $pkgDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
                      Where-Object { $_.FullName -match "x64" } |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlibPath) { throw "Azure.CodeSigning.Dlib.dll (x64) not found" }
          "TRUSTED_SIGNING_DLIB=$dlibPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Dlib at: $dlibPath"

      # Write the signing metadata JSON that the dlib reads at sign time.
      - name: Write Trusted Signing metadata
        if: steps.sign-mode.outputs.enabled == 'true'
        shell: pwsh
        env:
          TS_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          TS_CERT_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
        run: |
          $metadata = @{
            Endpoint = $env:TS_ENDPOINT
            CodeSigningAccountName = $env:TS_ACCOUNT_NAME
            CertificateProfileName = $env:TS_CERT_PROFILE
            ExcludeCredentials = @(
              "ManagedIdentityCredential",
              "EnvironmentCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            )
          }
          $metadataPath = "$env:RUNNER_TEMP\trusted-signing-metadata.json"
          $metadata | ConvertTo-Json | Out-File -FilePath $metadataPath -Encoding utf8
          "TRUSTED_SIGNING_METADATA=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Inject signCommand into tauri.conf.json so Tauri signs every
      # signable artifact (main .exe BEFORE bundling, then NSIS, then MSI).
      # We use the OBJECT notation { cmd, args } which bypasses Tauri's
      # shlex string parsing entirely — no quoting/escaping issues.
      # signtool is invoked DIRECTLY (no cmd.exe / no .cmd wrapper).
      - name: Inject Tauri signCommand for Authenticode
        if: steps.sign-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # Locate signtool.exe (Windows 10 SDK x64)
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe (x64) not found under $sdkRoot" }
          Write-Host "Using signtool: $signtool"
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append

          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $signCmd = [pscustomobject]@{
            cmd  = $signtool
            args = @(
              'sign',
              '/v',
              '/debug',
              '/fd', 'SHA256',
              '/tr', 'http://timestamp.acs.microsoft.com',
              '/td', 'SHA256',
              '/dlib', $env:TRUSTED_SIGNING_DLIB,
              '/dmdf', $env:TRUSTED_SIGNING_METADATA,
              '%1'
            )
          }
          if (-not $conf.bundle.windows) { $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force }
          $conf.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCmd -Force
          $conf | ConvertTo-Json -Depth 32 | Out-File -FilePath $confPath -Encoding utf8
          Write-Host "signCommand (object form):"
          $signCmd | ConvertTo-Json -Depth 6

      # Smoke-test signtool BEFORE the long Rust build, so any Azure auth or
      # dlib issue surfaces in seconds, not 12+ minutes (or 4 hours of hang).
      - name: Smoke-test signtool against a dummy binary
        if: steps.sign-mode.outputs.enabled == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Make a small valid PE file by copying an existing exe.
          $dummy = "$env:RUNNER_TEMP\dummy-sign-test.exe"
          Copy-Item -Path "$env:WINDIR\System32\notepad.exe" -Destination $dummy -Force
          Write-Host "Calling: $env:SIGNTOOL_PATH sign ... $dummy"
          & $env:SIGNTOOL_PATH sign /v /debug /fd SHA256 `
            /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib $env:TRUSTED_SIGNING_DLIB `
            /dmdf $env:TRUSTED_SIGNING_METADATA `
            $dummy
          if ($LASTEXITCODE -ne 0) { throw "signtool smoke-test failed with exit $LASTEXITCODE" }
          $sig = Get-AuthenticodeSignature -FilePath $dummy
          if ($sig.Status -ne 'Valid') { throw "Smoke-test artifact has invalid signature: $($sig.Status)" }
          Write-Host "Smoke-test OK: signed by $($sig.SignerCertificate.Subject)"

      # OPEN-WORK F4 — sign xray.exe BEFORE the build captures its hash.
      #
      # Windows stealth was dead on every signed release (v1.4.40 + v1.4.41
      # measured: the shipped resources\xray.exe hashed fc6382ef…/d481fccc…
      # while the build log — and the compiled-in XRAY_BINARY_SHA256 — said
      # 103da275…). Cause: tauri-bundler signs every .exe/.dll RESOURCE in
      # place during `tauri build` (tauri-bundler 2.9.4 — the crate pinned by
      # tauri-cli-v2.11.4, which is what the locked @tauri-apps/cli 2.11.4 is
      # built from; nsis/mod.rs generate_resource_data(): `if can_sign() &&
      # should_sign(&resource_path) { try_sign(...) }`), i.e. AFTER the
      # download step above hashed the pristine file, so xray.rs
      # verify_xray_integrity() refused the binary on every stealth connect.
      #
      # Fix: sign xray.exe here with the SAME signtool invocation the
      # signCommand uses, then re-capture XRAY_BINARY_SHA256 from the signed
      # bytes. tauri-bundler's should_sign() skips a resource whose
      # `signtool verify /pa` already succeeds (sign.rs:264-284), so the
      # bundler leaves these bytes alone and the shipped file hashes to the
      # value compiled in. That skip is the load-bearing assumption, so the
      # step runs the identical verify itself and fails if it does not pass —
      # and the post-bundle gate after the build proves the final installer
      # regardless.
      - name: Sign xray.exe BEFORE bundling and re-capture XRAY_BINARY_SHA256 from the signed bytes
        if: steps.sign-mode.outputs.enabled == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $xray = (Resolve-Path "src-tauri/resources/xray.exe").Path
          $before = (Get-FileHash -Path $xray -Algorithm SHA256).Hash.ToLowerInvariant()
          & $env:SIGNTOOL_PATH sign /v /debug /fd SHA256 `
            /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib $env:TRUSTED_SIGNING_DLIB `
            /dmdf $env:TRUSTED_SIGNING_METADATA `
            $xray
          if ($LASTEXITCODE -ne 0) { throw "signtool sign on xray.exe failed with exit $LASTEXITCODE" }

          # Exactly what tauri-bundler's should_sign() runs to decide whether
          # to re-sign the resource: if this fails, the bundler WOULD re-sign
          # and the compiled-in hash would be wrong again — fail now.
          & $env:SIGNTOOL_PATH verify /pa $xray
          if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa on the signed xray.exe failed (exit $LASTEXITCODE) — tauri-bundler would re-sign it during bundling and the shipped hash would drift" }
          $sig = Get-AuthenticodeSignature -FilePath $xray
          if ($sig.Status -ne 'Valid') { throw "xray.exe signature status $($sig.Status) after signing" }

          $after = (Get-FileHash -Path $xray -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -eq $before) { throw "xray.exe bytes unchanged by signing ($after) — signing did not happen" }
          # Last write to GITHUB_ENV wins for every later step, including the
          # build that bakes the value in via option_env!.
          "XRAY_BINARY_SHA256=$after" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "xray.exe signed by $($sig.SignerCertificate.Subject)"
          Write-Host "XRAY_BINARY_SHA256: $before (unsigned) -> $after (signed, compiled in)"

      - name: Build Tauri application
        timeout-minutes: 25
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ed25519 client-attestation key baked in by option_env! — see
          # src-tauri/src/api/attestation.rs and docs/CLIENT-ATTESTATION.md.
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
        # `-- --locked` reaches cargo: the CLI runs `cargo build --locked
        # --bins --features tauri/custom-protocol --release` (checked with
        # tauri-cli 2.11.4 and --runner echo). Ship exactly Cargo.lock.
        run: npx tauri build -- --locked

      # OPEN-WORK F4 — the gate that would have caught v1.4.40 and v1.4.41:
      # extract resources\xray.exe from the NSIS installer we are about to
      # ship and require its SHA-256 to equal the XRAY_BINARY_SHA256 the app
      # was just compiled with. Runs on EVERY build (unsigned ones must match
      # trivially); on signed builds the bundled file must also carry a Valid
      # Authenticode signature. Script + self-test: scripts/ci/.
      - name: Gate — bundled resources\xray.exe must hash to the compiled-in XRAY_BINARY_SHA256
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign-mode.outputs.enabled }}
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "No NSIS installer found to gate" }
          # HASHTABLE splat, not an array. The v1.4.42 tag build failed HERE
          # with "A positional parameter cannot be found that accepts argument
          # '-RequireAuthenticode'": an in-process `& script @array` passes the
          # elements positionally, and a bare '-Switch' element is not a
          # switch. The self-test never saw it because it spawns a child
          # `pwsh -File`, where argv binding does accept it — the harness and
          # the workflow were invoking the gate two different ways. The
          # self-test now also calls the script in-process with exactly this
          # form. The gate failed CLOSED, which is the right failure.
          $gateArgs = @{ Installer = $nsis.FullName; ExpectedSha256 = "$env:XRAY_BINARY_SHA256" }
          if ($env:SIGNED -eq 'true') { $gateArgs.RequireAuthenticode = $true }
          & ./scripts/ci/verify-bundled-xray-hash.ps1 @gateArgs
          if ($LASTEXITCODE -ne 0) { throw "bundled xray.exe gate failed (exit $LASTEXITCODE)" }

      # Sanity-check the artifacts we actually SHIP: both installers must be
      # Authenticode-signed, and so must the app .exe packed INSIDE the NSIS
      # installer (extracted with 7-Zip). The loose target/release exe is NOT
      # checked: since tauri 2.10 the bundler patches + signs a copy per bundle
      # type and then RESTORES the original unsigned bytes afterwards (to keep
      # cargo fingerprints stable), so an unsigned loose exe is expected.
      - name: Verify Authenticode signatures
        if: steps.sign-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) { throw "No installer artifacts found to verify" }

          # Extract the NSIS installer and add the inner app exe to the check list.
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $extractDir = "$env:RUNNER_TEMP\nsis-extract"
          & 7z x $nsis.FullName "-o$extractDir" -y | Out-Null
          $innerExe = Get-ChildItem -Path $extractDir -Recurse -Filter "birdo-vpn-desktop.exe" | Select-Object -First 1
          if (-not $innerExe) { throw "birdo-vpn-desktop.exe not found inside the NSIS installer" }
          $files += $innerExe

          $failed = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Error "UNSIGNED or INVALID: $($f.Name) (status=$($sig.Status))"
              $failed = $true
            } else {
              Write-Host "OK: $($f.Name) signed by $($sig.SignerCertificate.Subject)"
            }
          }
          if ($failed) { throw "One or more artifacts are not properly signed" }

      # Confirm Tauri emitted the per-installer minisign updater signature.
      # bundle.createUpdaterArtifacts=true makes `tauri build` write a
      # <setup>.exe.sig next to the NSIS installer, signed with
      # TAURI_SIGNING_PRIVATE_KEY. This is what the in-app updater verifies
      # against the embedded pubkey.
      - name: Verify Tauri updater signatures (.sig) exist
        if: steps.sign-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sigs = @()
          $sigs += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue
          if ($sigs.Count -eq 0) {
            throw "No updater .sig files found — createUpdaterArtifacts/TAURI_SIGNING_PRIVATE_KEY not applied"
          }
          foreach ($s in $sigs) { Write-Host "Updater signature: $($s.Name)" }

      # Integrity/provenance is handled ONCE in the release job: a single
      # SHA256SUMS.txt over the final asset names + one Sigstore bundle for it.
      # Per-artifact .sigstore files, MSI, and per-platform checksum files made
      # the release page a 30-asset wall that also verified against the WRONG
      # names (local build paths). Keep the artifact set minimal here.
      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # NSIS installers are already compressed

  # ══════════════════════════════════════════════════════════════════════
  # LINUX — began as a faithful copy of the retired build-linux.yml `build-linux` job.
  # AppImage + .deb + the minisign updater .sig. Checksums + Sigstore are
  # produced once, in the release job, over the final asset names.
  # ══════════════════════════════════════════════════════════════════════
  build-linux:
    needs: test  # never build/publish on a red test suite
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
            label: amd64
    # SENTRY_DSN lives at JOB level, not on the build step.
    #
    # It was on the step, which is correct for exactly as long as a job has one
    # build step — and release.yml's build-macos already has two (the signed
    # build and the unsigned fallback). A job-level env is the only form that
    # also covers a step somebody adds next year. Missing one build job is the
    # twin-drift defect this estate keeps re-finding, and a build with no DSN
    # now FAILS in build.rs rather than shipping an inert reporter.
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25  # build ~8.5 min cold (v1.4.45)
    # Builds and uploads only: Sigstore signing happens once, in the release
    # job, so no id-token and no contents: write here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No npm cache: a release restores nothing a PR could have written
          # (zizmor cache-poisoning). Explicit, because setup-node v7 turns
          # caching on by itself once package.json declares a packageManager.
          package-manager-cache: false

      - name: Set up the pinned Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare resources directory
        run: |
          mkdir -p src-tauri/resources
          touch src-tauri/resources/.gitkeep

      # Download + SHA-verify + bundle the pinned Xray Reality engine, mirroring
      # the Windows pipeline. Without this the release fails closed: xray.rs
      # refuses to exec an unverified binary and XRAY_BINARY_SHA256 stays unset.
      - name: Download pinned Xray Reality engine
        run: |
          set -euo pipefail
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          ZIP_PATH="${RUNNER_TEMP}/xray-linux-64.zip"
          curl -fsSL --retry 3 "$XRAY_URL" -o "$ZIP_PATH"
          ACTUAL=$(sha256sum "$ZIP_PATH" | awk '{print $1}')
          if [ "$ACTUAL" != "$XRAY_LINUX_SHA256" ]; then
            echo "::error::Xray zip SHA256 mismatch. Expected $XRAY_LINUX_SHA256, got $ACTUAL"
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d "${RUNNER_TEMP}/xray"
          install -m 0755 "${RUNNER_TEMP}/xray/xray" src-tauri/resources/xray
          BINARY_SHA=$(sha256sum src-tauri/resources/xray | awk '{print $1}')
          echo "XRAY_BINARY_SHA256=$BINARY_SHA" >> "$GITHUB_ENV"
          echo "Xray ready: src-tauri/resources/xray ($BINARY_SHA)"

      # A tagged release MUST be able to attest itself: without the secret,
      # option_env! is None and the shipped client silently sends no signature,
      # which an `enforce` server policy refuses. Fail here rather than ship it.
      - name: Require the desktop attestation key on tag builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
        run: |
          set -euo pipefail
          if [ -z "${BIRDO_DESKTOP_ATTEST_SK}" ] || [ -z "${BIRDO_DESKTOP_ATTEST_KID}" ]; then
            echo "::error::BIRDO_DESKTOP_ATTEST_SK/KID secret is empty — a tagged release cannot ship unattestable. See docs/CLIENT-ATTESTATION.md"
            exit 1
          fi
          echo "Attestation key present (kid: ${BIRDO_DESKTOP_ATTEST_KID})"

      - name: Build Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CD-3: SHA of the bundled xray binary, verified at runtime by xray.rs.
          XRAY_BINARY_SHA256: ${{ env.XRAY_BINARY_SHA256 }}
          # Ed25519 client-attestation key baked in by option_env! — see
          # src-tauri/src/api/attestation.rs and docs/CLIENT-ATTESTATION.md.
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
          ARCH: ${{ matrix.arch }}
        run: npx tauri build --target "$ARCH" -- --locked

      # MR-720 / MR-736: the Linux twin of build-windows' xray gate. Unpacks the
      # .deb and the AppImage exactly as shipped and requires
      # usr/lib/BirdoVPN/resources/xray to be executable and to hash to the
      # XRAY_BINARY_SHA256 this build compiled in (and that the app binary
      # really carries that value). Script + self-test: scripts/ci/; passes on
      # the published v1.4.45 packages.
      - name: Gate — bundled xray (.deb, .AppImage) must hash to the compiled-in XRAY_BINARY_SHA256
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$ARCH/release/bundle"
          shopt -s nullglob
          debs=("$bundle"/deb/*.deb)
          appimages=("$bundle"/appimage/*.AppImage)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb and one .AppImage under $bundle (found ${#debs[@]} and ${#appimages[@]})"
            exit 1
          fi
          bash scripts/ci/verify-bundled-xray.sh "${XRAY_BINARY_SHA256:-}" "${debs[0]}" "${appimages[0]}"

      # Integrity/provenance is handled ONCE in the release job (unified
      # SHA256SUMS.txt + one Sigstore bundle). The per-artifact .sigstore and
      # GPG .asc layers were removed with the release-page cleanup: the .asc
      # was documented as supplementary, and the per-platform checksum files
      # listed local build paths that never matched a published asset name.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-linux-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.arch }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.arch }}/release/bundle/appimage/*.AppImage.sig
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # .deb / AppImage are already compressed

  # ══════════════════════════════════════════════════════════════════════
  # Is the signed Mac App Store app live yet? (owner decision 2026-10-01)
  # The unsigned Tauri DMG keeps shipping ONLY until it is: Mac users must
  # never be left with no way to install. Apple's public lookup API decides;
  # a lookup failure counts as 'not live', so the DMG keeps shipping.
  # ══════════════════════════════════════════════════════════════════════
  mac-app-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      live: ${{ steps.lookup.outputs.live }}
    steps:
      - name: Look up BirdoVPN on the Mac App Store
        id: lookup
        shell: bash
        run: |
          set -uo pipefail
          live=false
          for c in gb us; do
            n=$(curl -fsS -m 20 "https://itunes.apple.com/lookup?bundleId=app.birdo.vpn&entity=macSoftware&country=$c" \
                | jq '[.results[]? | select(.kind == "mac-software")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then live=true; fi
          done
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if [ "$live" = true ]; then
            echo "::notice::BirdoVPN is live on the Mac App Store - the unsigned DMG is no longer built."
          else
            echo "Not on the Mac App Store yet - building the unsigned DMG for Mac users."
          fi

  # ══════════════════════════════════════════════════════════════════════
  # MACOS — faithful copy of build-macos.yml's `build-macos` job, with the
  # owner's explicit instruction: NO Apple Developer account exists, so this
  # MUST always build UNSIGNED (no codesign, no notarization). The job
  # already self-guards on APPLE_CERTIFICATE being present/absent (see
  # "Detect Apple signing capability" below) — since that secret is not
  # configured, it naturally always takes the unsigned-fallback path and
  # skips the notarize/staple step. Sigstore signing of the release (the one
  # SHA256SUMS.txt bundle) happens in the release job.
  #
  # REQUIRED while it runs (register MR-720): this job used to carry
  # `continue-on-error: true`, so a failed macOS build - or a .app that
  # shipped without its xray - published a release silently missing the Mac
  # assets or carrying a broken one. The `release` job now refuses to publish
  # unless this job succeeded, or was skipped because the Mac App Store app
  # is live (owner decision 2026-10-01: Mac users must never be left with no
  # way to install).
  # ══════════════════════════════════════════════════════════════════════
  build-macos:
    needs: [test, mac-app-store]  # never build on a red test suite
    if: needs.mac-app-store.outputs.live != 'true'  # retire the DMG once the Mac App Store app is live
    # ~8 min build (v1.4.45); 45 leaves room for the 30-minute notarytool
    # wait if Apple signing is ever configured.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1+). Was macos-14, which GitHub retires on
          # 2026-11-02 (brownouts fail jobs before then); macos-15 is the
          # image the x64 leg below already builds on.
          - runner: macos-15
            arch: aarch64-apple-darwin
            label: arm64
          - runner: macos-15        # Intel x86_64 (macos-13 deprecated)
            arch: x86_64-apple-darwin
            label: x64
    # SENTRY_DSN lives at JOB level, not on the build step.
    #
    # It was on the step, which is correct for exactly as long as a job has one
    # build step — and release.yml's build-macos already has two (the signed
    # build and the unsigned fallback). A job-level env is the only form that
    # also covers a step somebody adds next year. Missing one build job is the
    # twin-drift defect this estate keeps re-finding, and a build with no DSN
    # now FAILS in build.rs rather than shipping an inert reporter.
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No npm cache: a release restores nothing a PR could have written
          # (zizmor cache-poisoning). Explicit, because setup-node v7 turns
          # caching on by itself once package.json declares a packageManager.
          package-manager-cache: false

      # Installs the PINNED toolchain and adds the matrix target to it - the
      # cross target (x86_64-apple-darwin on the arm64 runner) must live on
      # the pinned toolchain, or `tauri build` fails "target not installed".
      - name: Set up the pinned Rust toolchain (rust-toolchain.toml) + target
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate macOS icon (icns) from PNG
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          sips -z 16 16     src-tauri/icons/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src-tauri/icons/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src-tauri/icons/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src-tauri/icons/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src-tauri/icons/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src-tauri/icons/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src-tauri/icons/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src-tauri/icons/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src-tauri/icons/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src-tauri/icons/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o src-tauri/icons/icon.icns

      - name: Prepare resources directory
        run: |
          mkdir -p src-tauri/resources
          touch src-tauri/resources/.gitkeep

      # Download + SHA-verify + bundle the pinned Xray Reality engine, mirroring
      # the Windows pipeline. Picks the asset for the matrix arch. Without this
      # the release fails closed: xray.rs refuses to exec an unverified binary
      # and XRAY_BINARY_SHA256 stays unset.
      - name: Download pinned Xray Reality engine
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          if [ "$LABEL" = "arm64" ]; then
            ASSET="Xray-macos-arm64-v8a.zip"
            EXPECTED="$XRAY_MACOS_ARM64_SHA256"
          else
            ASSET="Xray-macos-64.zip"
            EXPECTED="$XRAY_MACOS_AMD64_SHA256"
          fi
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${ASSET}"
          ZIP_PATH="${RUNNER_TEMP}/${ASSET}"
          curl -fsSL --retry 3 "$XRAY_URL" -o "$ZIP_PATH"
          ACTUAL=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Xray zip SHA256 mismatch for $ASSET. Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d "${RUNNER_TEMP}/xray"
          install -m 0755 "${RUNNER_TEMP}/xray/xray" src-tauri/resources/xray
          BINARY_SHA=$(shasum -a 256 src-tauri/resources/xray | awk '{print $1}')
          echo "XRAY_BINARY_SHA256=$BINARY_SHA" >> "$GITHUB_ENV"
          echo "Xray ready: src-tauri/resources/xray ($BINARY_SHA)"

      # A tagged release MUST be able to attest itself: without the secret,
      # option_env! is None and the shipped client silently sends no signature,
      # which an `enforce` server policy refuses. Fail here rather than ship it.
      - name: Require the desktop attestation key on tag builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
        run: |
          set -euo pipefail
          if [ -z "${BIRDO_DESKTOP_ATTEST_SK}" ] || [ -z "${BIRDO_DESKTOP_ATTEST_KID}" ]; then
            echo "::error::BIRDO_DESKTOP_ATTEST_SK/KID secret is empty — a tagged release cannot ship unattestable. See docs/CLIENT-ATTESTATION.md"
            exit 1
          fi
          echo "Attestation key present (kid: ${BIRDO_DESKTOP_ATTEST_KID})"

      # ── Apple codesign keychain setup ──────────────────────────────
      # Owner has no Apple Developer account: APPLE_CERTIFICATE is never
      # configured, so have_apple_signing is always "false" here and every
      # step below gated on it is always skipped. Kept intact (rather than
      # deleted) so signing can be turned on later just by adding secrets.
      - name: Detect Apple signing capability
        id: signcap
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "have_apple_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_apple_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE secret not set — building UNSIGNED DMG. Gatekeeper will quarantine it."
          fi

      - name: Import Apple Developer ID certificate
        if: steps.signcap.outputs.have_apple_signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/birdo-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # shellcheck disable=SC2046 # the existing keychain list is meant to word-split into separate arguments
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # ── Tauri build ────────────────────────────────────────────────
      - name: Build Tauri application (signed)
        if: steps.signcap.outputs.have_apple_signing == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CD-3: SHA of the bundled xray binary, verified at runtime by xray.rs.
          XRAY_BINARY_SHA256: ${{ env.XRAY_BINARY_SHA256 }}
          # Ed25519 client-attestation key baked in by option_env! — see
          # src-tauri/src/api/attestation.rs and docs/CLIENT-ATTESTATION.md.
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
          ARCH: ${{ matrix.arch }}
        run: npx tauri build --target "$ARCH" -- --locked

      - name: Build Tauri application (unsigned fallback)
        if: steps.signcap.outputs.have_apple_signing != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CD-3: SHA of the bundled xray binary, verified at runtime by xray.rs.
          XRAY_BINARY_SHA256: ${{ env.XRAY_BINARY_SHA256 }}
          # Attestation must ride the fallback too — an unsigned DMG that also
          # could not attest would be refused by an `enforce` server policy.
          BIRDO_DESKTOP_ATTEST_SK: ${{ secrets.BIRDO_DESKTOP_ATTEST_SK }}
          BIRDO_DESKTOP_ATTEST_KID: ${{ secrets.BIRDO_DESKTOP_ATTEST_KID }}
          ARCH: ${{ matrix.arch }}
        run: npx tauri build --target "$ARCH" -- --locked

      # ── Notarize + Staple ──────────────────────────────────────────
      - name: Notarize and staple DMG
        if: steps.signcap.outputs.have_apple_signing == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          DMG_FILE=$(find "src-tauri/target/$ARCH/release/bundle/dmg" -name '*.dmg' -print -quit || true)
          if [ -z "${DMG_FILE:-}" ]; then
            echo "::error::No DMG produced by Tauri build"
            exit 1
          fi

          echo "Notarizing $DMG_FILE ..."
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          echo "Stapling notarization ticket ..."
          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"

          echo "Verifying Gatekeeper acceptance ..."
          spctl --assess --type open --context context:primary-signature -vv "$DMG_FILE" || \
            echo "::warning::spctl assessment did not pass — investigate before release"

      # MR-720 / MR-736: the macOS twin of build-windows' xray gate, on all
      # three shipped forms - the .app, the updater .app.tar.gz and the .dmg
      # (mounted read-only). Contents/Resources/resources/xray must be
      # executable and hash to the XRAY_BINARY_SHA256 this build compiled in,
      # and the app binary must carry that value. Placed after notarize/staple
      # so it inspects the final bytes. Passes on the published v1.4.45
      # packages (both arches). Script + self-test: scripts/ci/.
      - name: Gate — bundled xray (.app, .app.tar.gz, .dmg) must hash to the compiled-in XRAY_BINARY_SHA256
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$ARCH/release/bundle"
          shopt -s nullglob
          apps=("$bundle"/macos/*.app)
          tars=("$bundle"/macos/*.app.tar.gz)
          dmgs=("$bundle"/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#tars[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .app, one .app.tar.gz and one .dmg under $bundle (found ${#apps[@]}, ${#tars[@]} and ${#dmgs[@]})"
            exit 1
          fi
          bash scripts/ci/verify-bundled-xray.sh "${XRAY_BINARY_SHA256:-}" "${apps[0]}" "${tars[0]}" "${dmgs[0]}"

      # Integrity/provenance is handled ONCE in the release job (unified
      # SHA256SUMS.txt + one Sigstore bundle over the final asset names).
      - name: Cleanup keychain
        if: always() && steps.signcap.outputs.have_apple_signing == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/birdo-build.keychain-db"
          # Cleanup must never fail the job (it runs after a failure too).
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-macos-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.arch }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.arch }}/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # .dmg / .app.tar.gz are already compressed

  # ══════════════════════════════════════════════════════════════════════
  # ONE GitHub Release for ALL platforms, from ONE tag.
  # Windows, Linux AND macOS are REQUIRED: the guard below refuses to publish
  # unless each succeeded. The only exception is macOS once the Mac App Store
  # app is live (then build-macos is skipped by design and no DMG ships).
  # ══════════════════════════════════════════════════════════════════════
  release:
    needs: [test, build-windows, build-linux, mac-app-store, build-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # create the GitHub Release and upload its assets
      id-token: write  # Sigstore keyless signing of the unified SHA256SUMS.txt
    steps:
      - name: Require the test gate + every platform build to have succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          MAS_RESULT: ${{ needs.mac-app-store.result }}
          MAS_LIVE: ${{ needs.mac-app-store.outputs.live }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::test result=$TEST_RESULT — the Rust unit tests / vitest gate did not pass, refusing to publish a release"
            fail=1
          fi
          if [ "$WINDOWS_RESULT" != "success" ]; then
            echo "::error::build-windows result=$WINDOWS_RESULT — Windows is a REQUIRED platform, refusing to publish a release"
            fail=1
          fi
          if [ "$LINUX_RESULT" != "success" ]; then
            echo "::error::build-linux result=$LINUX_RESULT — Linux is a REQUIRED platform, refusing to publish a release"
            fail=1
          fi
          if [ "$MAS_RESULT" != "success" ]; then
            echo "::error::mac-app-store result=$MAS_RESULT — cannot tell whether the Mac DMG is still required, refusing to publish a release"
            fail=1
          elif [ "$MAS_LIVE" = "true" ]; then
            echo "Mac App Store app is live — no DMG/updater bundle in this release (build-macos: $MACOS_RESULT)"
          elif [ "$MACOS_RESULT" != "success" ]; then
            echo "::error::build-macos result=$MACOS_RESULT — macOS is a REQUIRED platform until the Mac App Store app is live (owner decision 2026-10-01), refusing to publish a release without it"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Test gate, Windows, Linux and macOS OK."

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: birdo-vpn-windows-installers
          path: release-files/windows/

      - name: Flatten Windows artifacts
        shell: bash
        run: |
          # Flatten any nested directories (nsis/, msi/) from the artifact upload
          find release-files/windows -type f -exec mv {} release-files/windows/ \; 2>/dev/null || true
          ls -la release-files/windows/

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: birdo-vpn-linux-amd64
          path: release-files/linux/

      # The guard above has already refused to publish if macOS was required
      # and failed, so a skipped build-macos here means only "Mac App Store
      # app is live"; otherwise both downloads must succeed. The `files:`
      # globs below match nothing for a skipped platform.
      - name: Download macOS arm64 artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: birdo-vpn-macos-arm64
          path: release-files/macos-arm64/

      - name: Download macOS x64 artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: birdo-vpn-macos-x64
          path: release-files/macos-x64/

      # Name every asset for the platform it runs on, and disambiguate the
      # basenames that would otherwise collide.
      #
      # Two jobs in one pass:
      #  * The bundlers emit `BirdoVPN_<ver>_<arch>.<ext>` with no OS token, so
      #    `_x64-setup.exe` vs `_amd64.AppImage` vs `_x64.dmg` were only
      #    distinguishable if you already knew which bundler produced which
      #    extension. Insert an OS token: `BirdoVPN_<ver>_<OS>_<arch>.<ext>`.
      #  * Both macOS builds emit a generic `BirdoVPN.app.tar.gz` (+ its .sig) —
      #    identical basenames. A GitHub release cannot hold two assets with the
      #    same name (softprops uploads by basename), so the second upload 404s
      #    on the metadata update and fails the job. (Per-platform
      #    SHA256SUMS.txt, .sigstore and GPG .asc files used to collide the same
      #    way. None is built any more: the one SHA256SUMS.txt and its Sigstore
      #    bundle are made further down, after this rename.)
      #
      # !! DO NOT rename in a way that breaks the updater !!
      # `backend/src/updates/updates.controller.ts` resolves the bundle to serve
      # by matching, on the asset FILENAME:
      #   1. an installer suffix — /-setup\.exe$/, /\.AppImage$/, /\.app\.tar\.gz$/
      #   2. an arch token anywhere in the name — x86_64|x64|amd64 / aarch64|arm64
      #   3. the detached signature by EXACT `<installer-name>.sig`
      # So the OS token may only be INSERTED (never replacing the arch token or
      # the extension), and the .sig companion (the updater signature, the only
      # per-installer companion shipped) must be renamed in lockstep with its
      # installer — which the shared `BirdoVPN_<ver>_` prefix rule below does
      # automatically, since a companion is just the installer name plus a
      # suffix. `updates.controller.spec.ts` asserts the patterns
      # still match these exact names; run it if you touch this.
      - name: Name assets per platform (and disambiguate collisions)
        shell: bash
        run: |
          set -euo pipefail
          label() {
            local root="$1" os="$2" suffix="$3"
            [ -d "$root" ] || return 0
            # Insert the OS token after the version: BirdoVPN_1.2.3_x64-setup.exe
            # -> BirdoVPN_1.2.3_Windows_x64-setup.exe. Applies to installers AND
            # their .sig companions, keeping the pairing intact.
            find "$root" -type f -name 'BirdoVPN_*' | while read -r f; do
              b="$(basename "$f")"
              n="$(printf '%s' "$b" | sed -E "s/^BirdoVPN_([0-9][^_]*)_/BirdoVPN_\1_${os}_/")"
              [ "$b" = "$n" ] || mv "$f" "$(dirname "$f")/$n"
            done
            # macOS updater bundle ships as a generic `BirdoVPN.app.tar.gz`.
            find "$root" -type f -name 'BirdoVPN.app.tar.gz*' | while read -r f; do
              mv "$f" "$(dirname "$f")/$(basename "$f" | sed "s/^BirdoVPN\.app/BirdoVPN-$suffix.app/")"
            done
          }
          label release-files/windows     Windows windows
          label release-files/linux       Linux   linux
          label release-files/macos-arm64 macOS   macos-arm64
          label release-files/macos-x64   macOS   macos-x64

      # Fail the release rather than publish assets the updater cannot resolve.
      # A mis-rename is otherwise SILENT: the release looks fine and every
      # installed client simply stops being offered updates.
      - name: Verify updater can still resolve each installer
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            local dir="$1" desc="$2" installer_re="$3" arch_re="$4"
            [ -d "$dir" ] || return 0
            local hit
            hit="$(find "$dir" -type f | grep -E "$installer_re" | grep -vE '\.(sig|sigstore|asc)$' || true)"
            if [ -z "$hit" ]; then
              echo "::error::no $desc installer matching $installer_re in $dir"
              fail=1; return 0
            fi
            while read -r f; do
              local b; b="$(basename "$f")"
              if ! printf '%s' "$b" | grep -qE "$arch_re"; then
                echo "::error::$b has no arch token matching $arch_re — updater cannot serve it"
                fail=1
              fi
              if [ ! -f "$f.sig" ]; then
                echo "::error::$b is missing its detached signature $b.sig"
                fail=1
              fi
              echo "ok: $b (+ $b.sig)"
            done <<< "$hit"
          }
          check release-files/windows     "Windows NSIS" '\-setup\.exe$'   '(x86[_-]?64|x64|amd64)'
          check release-files/linux       "Linux AppImage" '\.AppImage$'   '(x86[_-]?64|x64|amd64)'
          check release-files/macos-arm64 "macOS arm64"  '\.app\.tar\.gz$' '(aarch64|arm64)'
          check release-files/macos-x64   "macOS x64"    '\.app\.tar\.gz$' '(x86[_-]?64|x64|amd64)'
          [ "$fail" -eq 0 ] || { echo "Updater asset contract violated — refusing to publish"; exit 1; }

      # ── ONE checksums file over the FINAL asset names ─────────────────
      # Generated AFTER the rename so the names in SHA256SUMS.txt are exactly
      # the names users download (the per-platform files this replaces listed
      # local build paths like ./deb/… that never matched a published asset,
      # so `sha256sum -c` could never succeed). Its single Sigstore bundle
      # transitively covers every artifact EXCEPT the updater `.sig` files,
      # which the find below deliberately excludes — those are verified
      # independently by the updater against its embedded minisign public key,
      # not via this checksums file (P5-CICD-25). Verify (MR-747: pin the
      # signer to THIS workflow at THIS tag, or any GitHub Actions identity
      # passes - cosign v3 refuses to verify at all without an identity):
      #   cosign verify-blob --bundle SHA256SUMS.txt.sigstore \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity "https://github.com/BirdoVPN/Desktop-Client/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
      #     SHA256SUMS.txt
      #   sha256sum -c SHA256SUMS.txt --ignore-missing
      # (Checked against v1.4.45 with cosign v3.1.3: passes; a wrong tag, another
      # repo's workflow or an edited SHA256SUMS.txt fails. docs/VERIFICATION.md.)
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate + Sigstore-sign the unified SHA256SUMS.txt
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          : > release-files/SHA256SUMS.txt
          while IFS= read -r f; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> release-files/SHA256SUMS.txt
          done < <(find release-files -type f ! -name '*.sig' ! -name 'SHA256SUMS.txt' | sort)
          cat release-files/SHA256SUMS.txt
          cosign sign-blob --yes --bundle release-files/SHA256SUMS.txt.sigstore release-files/SHA256SUMS.txt

      - name: List all release files
        shell: bash
        run: find release-files -type f -print || true

      # Owner decision 2026-10-01: GitHub 'Latest' must ALWAYS be the newest
      # fully released build - and birdo-web's download page reads
      # /releases/latest. A blanket make_latest: true let an OLDER tag take
      # Latest back: re-running a previous tag's workflow, or two tags whose
      # runs finish out of order. So a tag takes Latest only if no newer vX.Y.Z
      # is already published. On the normal path (the newest tag) this is
      # true, exactly as before. (Two publishes within the same few seconds can
      # still race; serialising publishes instead would let a third queued
      # tag's run cancel the second's - a dropped release is worse.)
      - name: Decide whether this tag becomes GitHub Latest
        id: latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is not plain vX.Y.Z - keeping make_latest: true (unchanged behaviour)"
            exit 0
          fi
          # Bounded retry; if the API stays unreachable, fall back to the
          # behaviour before this guard rather than block the release.
          published="" listed=false
          for attempt in 1 2 3; do
            if published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'); then
              listed=true
              break
            fi
            echo "release listing failed (attempt $attempt/3)"
            sleep 5
          done
          if [ "$listed" != true ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "::warning::could not list releases - keeping make_latest: true (the behaviour before this guard)"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$published" "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is the newest release - it becomes Latest"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is older than the already-published $newest - publishing it WITHOUT moving GitHub Latest off $newest"
          fi

      # Only actually publish on a real tag push (workflow_dispatch builds are
      # for manual/debug runs and cut no release); no hand-flipped drafts. The
      # guard above already refuses to get here unless the test gate and every
      # required platform succeeded.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-files/windows/*
            release-files/linux/**/*
            release-files/macos-arm64/**/*
            release-files/macos-x64/**/*
            release-files/SHA256SUMS.txt
            release-files/SHA256SUMS.txt.sigstore
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: ${{ steps.latest.outputs.make_latest }}
